<style>
:root {
  --bg: #f0f7ff;
  --bg2: #dbeafe;
  --bg3: #bfdbfe;
  --surface: #ffffff;
  --border: #93c5fd;
  --fg: #0c2340;
  --fg2: #1e4d8c;
  --accent: #2563eb;
  --accent-hot: #f97316;
  --shadow: rgba(37,99,235,0.18);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg); color: var(--fg); overflow: hidden; user-select: none;
}
.jp-text { font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif; }
.cn-text { font-family: 'Noto Sans SC', sans-serif; }
[hidden] { display: none !important; }

#app { display: flex; flex-direction: column; height: 100%; }
.top-nav {
  display: flex; align-items: center; gap: 10px; padding: 12px 20px;
  background: var(--surface); border-bottom: 2px solid var(--border);
  box-shadow: 0 2px 12px var(--shadow); z-index: 50; flex-shrink: 0;
}
.nav-logo { font-size: 1.6rem; font-weight: 900; color: var(--accent); margin-right: auto; cursor: pointer; }
.nav-logo span { color: var(--accent-hot); }
.nav-btn {
  background: none; border: 2px solid transparent; cursor: pointer;
  padding: 8px 18px; border-radius: 24px; font-size: 0.95rem; font-weight: 700; color: var(--fg2);
}
.nav-btn:hover { background: var(--bg2); border-color: var(--border); }

.tetris-wrap {
  flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative;
  background: linear-gradient(180deg, #38bdf8 0%, #818cf8 55%, #c084fc 100%);
}
.tetris-wrap::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 120px 50px at 10% 15%, rgba(255,255,255,0.55) 0%, transparent 70%),
    radial-gradient(ellipse 90px 40px at 80% 8%, rgba(255,255,255,0.45) 0%, transparent 70%),
    radial-gradient(ellipse 70px 35px at 55% 22%, rgba(255,255,255,0.35) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}
.tetris-top {
  display: flex; align-items: center; gap: 14px; padding: 12px 20px;
  background: rgba(0,0,0,0.18); backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(255,255,255,0.25); color: #fff; z-index: 10;
}
.tet-back-btn {
  background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.5);
  border-radius: 24px; padding: 7px 16px; font-size: 0.95rem; font-weight: 700; color: #fff; cursor: pointer;
}
.tet-back-btn:hover { background: rgba(255,255,255,0.4); }
.tetris-score { font-size: 1.05rem; font-weight: 900; color: #fff; }
.tetris-score span { background: rgba(255,255,255,0.2); border-radius: 20px; padding: 4px 12px; margin-left: 4px; }
.word-count-badge { font-size: 0.8rem; font-weight: 700; color: rgba(255,255,255,0.9); background: rgba(0,0,0,0.2); border-radius: 12px; padding: 3px 10px; margin-left: auto; }
.tetris-lives { display: flex; gap: 5px; margin-left: auto; font-size: 1.4rem; }
.life-icon.lost { filter: grayscale(1); opacity: 0.25; transform: scale(0.8); }

.tetris-subbar {
  display: flex; align-items: center; gap: 10px; padding: 8px 20px;
  background: rgba(0,0,0,0.12); border-bottom: 1px solid rgba(255,255,255,0.18); z-index: 10;
}
.tet-mode-switch { display: flex; background: rgba(0,0,0,0.25); border-radius: 20px; padding: 3px; gap: 2px; }
.tet-mode-btn {
  border: none; background: transparent; color: rgba(255,255,255,0.75);
  font-size: 0.82rem; font-weight: 700; padding: 5px 13px; border-radius: 16px; cursor: pointer;
}
.tet-mode-btn.active { background: rgba(255,255,255,0.92); color: #1e3a8a; }
.tet-mistake-chip { font-size: 0.8rem; font-weight: 700; color: rgba(255,255,255,0.85); background: rgba(0,0,0,0.2); border-radius: 12px; padding: 3px 10px; }
.tet-mistake-chip.warn { background: rgba(239,68,68,0.55); color: #fff; }
.tet-hint-btn {
  margin-left: auto; border: 2px solid rgba(255,235,120,0.75); background: rgba(255,235,120,0.22);
  color: #fff; font-size: 0.85rem; font-weight: 700; padding: 5px 14px; border-radius: 18px; cursor: pointer;
}

.tetris-word-display { padding: 14px 20px; text-align: center; z-index: 10; background: rgba(0,0,0,0.1); }
.tetris-kanji-hint { font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 900; color: #fff; letter-spacing: 0.05em; min-height: 48px; }
.tetris-meaning-hint { font-size: 1.1rem; color: rgba(255,255,255,0.9); font-weight: 700; margin-top: 3px; }

.tetris-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; position: relative; overflow: hidden; min-height: 0; }
.tetris-canvas-wrap { flex: 1; width: 100%; position: relative; overflow: hidden; min-height: 0; }
#tetris-canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

.tetris-preview {
  position: absolute; inset: 0; z-index: 15; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; background: rgba(0,0,0,0.34); backdrop-filter: blur(3px);
}
.preview-kana { font-size: clamp(2rem, 6.5vw, 3.4rem); font-weight: 900; color: #fff; }
.preview-hint { font-size: 0.95rem; font-weight: 700; color: rgba(255,255,255,0.9); }
.preview-bar { width: min(260px, 62%); height: 8px; border-radius: 4px; background: rgba(255,255,255,0.28); overflow: hidden; }
.preview-bar-fill { height: 100%; width: 100%; border-radius: 4px; background: #fbbf24; }

.tetris-pause-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.55); display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 20; backdrop-filter: blur(6px); gap: 16px; color: #fff;
}
.pause-text { font-size: 2.5rem; font-weight: 900; }

.tetris-ground { width: 100%; padding-bottom: 10px; z-index: 6; background: rgba(0,0,0,0.08); border-top: 2px solid rgba(255,255,255,0.25); }
.tetris-slots-row { display: flex; justify-content: center; gap: 0; padding: 8px 0 0; }
.tetris-slot {
  height: 72px; border: 2.5px solid rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem; font-weight: 900; color: #fff; background: rgba(255,255,255,0.2); backdrop-filter: blur(6px);
  position: relative; flex-shrink: 0;
}
.tetris-slot:first-child { border-radius: 14px 0 0 14px; }
.tetris-slot:last-child { border-radius: 0 14px 14px 0; }
.tetris-slot:only-child { border-radius: 14px; }
.tetris-slot.correct-slot { background: rgba(16,185,129,0.55); border-color: #34d399; }
.tetris-slot.wrong-slot { background: rgba(239,68,68,0.45); border-color: #fca5a5; }
.tetris-slot.pending-slot { background: rgba(255,255,255,0.35); border-color: #fff; border-style: dashed; }
.tetris-slot.hint-slot { background: rgba(255,235,120,0.55); border-color: #fde68a; }
.tetris-slot-num { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); font-size: 0.62rem; color: rgba(255,255,255,0.65); }

.tetris-controls { display: flex; gap: 16px; justify-content: center; align-items: center; padding: 14px 20px; background: rgba(0,0,0,0.15); z-index: 10; }
.ctrl-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tetris-ctrl-btn {
  width: 72px; height: 72px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.6);
  background: rgba(255,255,255,0.25); backdrop-filter: blur(6px); font-size: 1.6rem; color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.tetris-ctrl-btn:active { background: rgba(255,255,255,0.45); transform: scale(0.92); }
.ctrl-label { font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.75); margin-top: 4px; }

.toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--fg); color: #fff; border-radius: 28px; padding: 12px 26px;
  font-size: 1rem; font-weight: 700; opacity: 0; transition: all 0.25s ease; z-index: 300; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center;
  z-index: 200; padding: 20px; backdrop-filter: blur(8px);
}
.overlay-card {
  background: var(--surface); border-radius: 28px; padding: 34px 28px; text-align: center;
  width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 24px 70px rgba(0,0,0,0.35); border: 2px solid var(--border);
}
.overlay-emoji { font-size: 3.2rem; }
.overlay-title { font-size: 1.8rem; font-weight: 900; }
.overlay-body { font-size: 1rem; color: var(--fg2); line-height: 1.65; }
.overlay-stats-box {
  background: var(--bg); border-radius: 16px; padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; font-size: 0.9rem; font-weight: 700; text-align: left;
}
.overlay-stats-item b { color: var(--accent); }
.overlay-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
.action-btn { padding: 10px 20px; border-radius: 24px; border: none; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
.btn-primary { background: linear-gradient(135deg, var(--accent), #1d4ed8); color: #fff; }
.btn-hot { background: linear-gradient(135deg, var(--accent-hot), #ea580c); color: #fff; }
.btn-secondary { background: var(--surface); color: var(--fg2); border: 2px solid var(--border); }
</style>

<script>
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  return audioCtx;
}
['pointerdown', 'keydown', 'touchstart'].forEach(evt => {
  window.addEventListener(evt, () => getAudioCtx(), { once: false, passive: true });
});

function playTone(freq, type, duration, vol, decay) {
  try {
    const ctx = getAudioCtx(); if (!ctx) return;
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type || 'sine'; osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(vol || 0.35, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (decay || duration));
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + duration);
  } catch(e){}
}
function sfxClick() { playTone(520, 'sine', 0.07, 0.22, 0.06); }
function sfxLand() {
  playTone(523, 'sine', 0.12, 0.32, 0.11);
  setTimeout(() => playTone(784, 'triangle', 0.16, 0.34, 0.15), 65);
}
function sfxWrong() {
  playTone(280, 'sawtooth', 0.22, 0.32, 0.2);
  setTimeout(() => playTone(195, 'sawtooth', 0.24, 0.30, 0.22), 95);
}
function sfxWordComplete() {
  [523, 659, 784, 1047, 1319].forEach((f, i) => {
    setTimeout(() => playTone(f, 'triangle', 0.28, 0.55, 0.25), i * 68);
  });
}
function sfxGameOver() {
  [330, 294, 262, 220].forEach((f, i) => setTimeout(() => playTone(f, 'sawtooth', 0.28, 0.35, 0.25), i * 100));
}

let toastTimer = null;
function showToast(msg, duration = 2200) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), duration);
}

const SUPABASE_URL = 'https://zbfjbtzvnhmfzyvooact.supabase.co';
const SUPABASE_KEY = 'sb_publishable_AP0YnQLgzmB3d63_4zbpjg_vHeTyo8Z';
const sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
let currentUser = null;

async function initAuth() {
  if (!sbClient) return;
  const { data: { session } } = await sbClient.auth.getSession();
  if (session) currentUser = session.user;
}

async function recordMistake(word) {
  let localMistakes = JSON.parse(localStorage.getItem('tangogo_mistakes') || '[]');
  if (!localMistakes.some(m => m.word === word.kana)) {
    localMistakes.push({ word: word.kana, meaning: word.meaning });
    localStorage.setItem('tangogo_mistakes', JSON.stringify(localMistakes));
  }
  if (currentUser && sbClient) {
    try {
      await sbClient.from('user_mistakes').upsert({
        user_id: currentUser.id,
        word: word.kana,
        meaning: word.meaning,
        wrong_count: 1,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id,word' });
    } catch (e) { console.error(e); }
  }
}

// 统一参数对照映射表
function normalizeParams(rawBook, rawGrade, rawLesson) {
  let b = rawBook || 'pep_jr';
  let g = rawGrade || 'pep_jr_7';
  let l = rawLesson || 'pep_jr_7_intro1';

  if (b === 'renjiao-new') b = 'pep_jr';
  if (g === 'grade7') g = 'pep_jr_7';
  if (l === 'unit1_lesson1') l = 'pep_jr_7_intro1';

  return { b, g, l };
}

const urlParams = new URLSearchParams(window.location.search);
const { b: currentBook, g: currentGrade, l: currentLesson } = normalizeParams(
  urlParams.get('book'),
  urlParams.get('grade'),
  urlParams.get('lesson')
);

  {"kanji":"本","kana":"ほん","pos":"名词","meaning":"书"},
  {"kanji":"靴","kana":"くつ","pos":"名词","meaning":"鞋"},
  {"kanji":"","kana":"ノート","pos":"名词","meaning":"笔记本，本子"},
  {"kanji":"先生","kana":"せんせい","pos":"名词","meaning":"老师"},

];

let FULL_LESSON_WORDS = [];
const GROUP_SIZE = 10;
let currentGroupIndex = 0;
let totalGroups = 1;
let lessonStartTime = Date.now();
let lessonScoreTotal = 0;

// 从 Supabase 动态加载当前课所有单词
async function fetchCurrentLessonWords() {
  if (sbClient) {
    try {
      const { data, error } = await sbClient
        .from('words')
        .select('kanji,kana,pos,meaning')
        .eq('book_id', currentBook)
        .eq('grade_id', currentGrade)
        .eq('lesson_id', currentLesson)
        .order('sort_order', { ascending: true })
        .order('created_at', { ascending: true });

      if (!error && data && data.length > 0) {
        showToast(`已成功载入云端题库（共 ${data.length} 词）`);
        return data;
      }
    } catch (e) {
      console.warn('读取云端失败:', e);
    }
  }

}

const MAX_MISTAKES_PER_LIFE = 3;
let tetWords = [];
let tetWordIdx = 0;
let tetScore = 0;
let tetLevel = 1;
let tetLives = 3;
let tetMistakes = 0;
let tetOrderMode = 'random';

let tetKanaList = [];
let tetSlotFilled = [];
let tetFallQueue = [];

let tetSlotW = 68;
let tetRunning = false;
let tetPaused = false;
let tetPreviewing = false;
let tetPreviewTimer = null;
let tetHintSlot = -1;
let tetHintTimer = null;
let tetAnimId = null;
let tetLastTime = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function splitKana(str) { return Array.from(str.trim()); }

function startGroup(groupIdx) {
  currentGroupIndex = groupIdx;
  const start = groupIdx * GROUP_SIZE;
  const end = Math.min(start + GROUP_SIZE, FULL_LESSON_WORDS.length);
  
  // 按照分组索引提取题目并打乱
  tetWords = shuffle(FULL_LESSON_WORDS.slice(start, end));
  tetWordIdx = 0;
  tetScore = 0;
  tetLevel = groupIdx + 1;
  tetLives = 3;
  tetMistakes = 0;
  tetRunning = true;
  tetPaused = false;

  document.getElementById('tet-score').textContent = tetScore;
  document.getElementById('tet-level').textContent = tetLevel;
  renderLives();
  renderMistakes();
  syncModeUI();
  loadTetrisWord();
}

function renderLives() {
  const el = document.getElementById('tet-lives');
  el.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const span = document.createElement('span');
    span.className = 'life-icon' + (i >= tetLives ? ' lost' : '');
    span.textContent = '❤️';
    el.appendChild(span);
  }
}

function renderMistakes() {
  const el = document.getElementById('tet-mistakes');
  el.textContent = `失误 ${tetMistakes}/${MAX_MISTAKES_PER_LIFE}`;
  el.classList.toggle('warn', tetMistakes === MAX_MISTAKES_PER_LIFE - 1);
}

function syncModeUI() {
  document.querySelectorAll('.tet-mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === tetOrderMode);
  });
}

function buildFallQueue() {
  const remaining = [];
  for (let i = 0; i < tetKanaList.length; i++) {
    if (!tetSlotFilled[i]) remaining.push(i);
  }
  return tetOrderMode === 'order' ? remaining : shuffle(remaining);
}

function setTetrisOrderMode(mode) {
  if (mode !== 'random' && mode !== 'order') return;
  tetOrderMode = mode;
  syncModeUI();
  sfxClick();

  if (tetRunning) {
    tetFallQueue = buildFallQueue();
    if (tetCurrentBlock && !tetPreviewing) {
      const nextTarget = tetFallQueue.shift();
      if (nextTarget !== undefined) {
        tetCurrentBlock.targetSlot = nextTarget;
        tetCurrentBlock.kana = tetKanaList[nextTarget];
      }
    }
    clearHint();
    renderSlots();
  }

  showToast(mode === 'order'
    ? '🔢 顺序模式：假名按顺序掉落，有箭头提示，练顺序'
    : '🎲 随机模式：假名打乱掉落，无提示，测记忆');
}

function useTetrisHint() {
  if (!tetRunning || tetPaused || tetPreviewing || !tetCurrentBlock) return;

  const target = tetCurrentBlock.targetSlot;
  tetHintSlot = target;
  sfxClick();

  tetScore = Math.max(0, tetScore - 3);
  document.getElementById('tet-score').textContent = tetScore;
  renderSlots();

  const hintBtn = document.getElementById('tet-hint');
  hintBtn.disabled = true;
  showToast(`💡 「${tetCurrentBlock.kana}」应该落在第 ${target + 1} 格 (-3 分)`);

  clearTimeout(tetHintTimer);
  tetHintTimer = setTimeout(() => {
    tetHintSlot = -1;
    renderSlots();
    if (tetRunning && !tetPaused && !tetPreviewing) hintBtn.disabled = false;
  }, 2200);
}

function clearHint() {
  clearTimeout(tetHintTimer);
  tetHintSlot = -1;
  const hintBtn = document.getElementById('tet-hint');
  if (hintBtn) hintBtn.disabled = false;
}

function loadTetrisWord() {
  if (tetWordIdx >= tetWords.length) {
    tetRunning = false;
    cancelAnimationFrame(tetAnimId);
    sfxWordComplete();
    lessonScoreTotal += tetScore;
    handleGroupOrLessonCompletion();
    return;
  }

  const word = tetWords[tetWordIdx];
  tetKanaList = splitKana(word.kana);
  tetSlotFilled = new Array(tetKanaList.length).fill(false);
  tetFallQueue = buildFallQueue();
  tetCurrentBlock = null;
  clearHint();

  const hasKanji = word.kanji && word.kanji.trim() !== '' && word.kanji.trim() !== word.kana.trim();
  document.getElementById('tet-kanji').textContent = hasKanji ? word.kanji : '——';
  document.getElementById('tet-meaning').textContent = `${word.pos ? '[' + word.pos + '] ' : ''}${word.meaning}`;
  document.getElementById('tet-word-count').textContent = `${tetWordIdx + 1}/${tetWords.length}`;

  setupCanvas();
  renderSlots();
  startWordPreview(word);
}

function handleGroupOrLessonCompletion() {
  const isLessonComplete = (currentGroupIndex >= totalGroups - 1);
  const overlay = document.getElementById('overlay');
  const emojiEl = document.getElementById('ov-emoji');
  const titleEl = document.getElementById('ov-title');
  const bodyEl = document.getElementById('ov-body');
  const statsEl = document.getElementById('ov-stats');
  const actEl = document.getElementById('ov-actions');
  actEl.innerHTML = '';

  if (!isLessonComplete) {
    emojiEl.textContent = '👏';
    titleEl.textContent = `第 ${currentGroupIndex + 1} 组挑战成功！`;
    bodyEl.textContent = `本组已完成，得分：${tetScore} 分。当前进度：${(currentGroupIndex + 1) * GROUP_SIZE}/${FULL_LESSON_WORDS.length} 词。`;
    statsEl.hidden = true;

    actEl.appendChild(createBtn('下一组 (' + (currentGroupIndex + 2) + '/' + totalGroups + ')', 'btn-primary', () => {
      overlay.hidden = true;
      startGroup(currentGroupIndex + 1);
    }));
    actEl.appendChild(createBtn('再来1遍', 'btn-secondary', () => {
      overlay.hidden = true;
      startGroup(currentGroupIndex);
    }));
    actEl.appendChild(createBtn('回到首页', 'btn-secondary', () => location.href = 'index.html'));
  } else {
    const totalSeconds = Math.max(1, Math.round((Date.now() - lessonStartTime) / 1000));
    const m = Math.floor(totalSeconds / 60); const s = totalSeconds % 60;
    const timeFormatted = `${m > 0 ? m + '分' : ''}${s}秒`;

    emojiEl.textContent = '🏆';
    titleEl.textContent = '整课大通关！';
    bodyEl.textContent = `太棒了！您已成功掌握了本课全部 ${FULL_LESSON_WORDS.length} 个单词！`;
    statsEl.hidden = false;
    statsEl.innerHTML = `
      <div class="overlay-stats-item">总得分：<b>${lessonScoreTotal} 分</b></div>
      <div class="overlay-stats-item">总用时：<b>${timeFormatted}</b></div>
      <div class="overlay-stats-item">总词数：<b>${FULL_LESSON_WORDS.length} 词</b></div>
      <div class="overlay-stats-item">剩余生命：<b>${tetLives} ❤️</b></div>
    `;

    actEl.appendChild(createBtn('下一课', 'btn-primary', () => {
      showToast('正在前往下一课...');
      setTimeout(() => location.href = 'blocks.html?lesson=pep_jr_7_intro2', 600);
    }));
    actEl.appendChild(createBtn('再来1遍', 'btn-secondary', () => {
      overlay.hidden = true;
      lessonStartTime = Date.now();
      lessonScoreTotal = 0;
      startGroup(0);
    }));
    actEl.appendChild(createBtn('📸 分享成绩', 'btn-hot', () => generateShareCard(lessonScoreTotal, timeFormatted, FULL_LESSON_WORDS.length)));
    actEl.appendChild(createBtn('回到首页', 'btn-secondary', () => location.href = 'index.html'));
  }
  overlay.hidden = false;
}

function createBtn(text, cls, onClick) {
  const b = document.createElement('button');
  b.className = 'action-btn cn-text ' + cls;
  b.textContent = text;
  b.onclick = onClick;
  return b;
}

function generateShareCard(score, timeSpent, totalWords) {
  showToast('正在生成成绩单图片...');
  const cvs = document.createElement('canvas');
  cvs.width = 640; cvs.height = 880;
  const ctx = cvs.getContext('2d');
  const bgGrad = ctx.createLinearGradient(0, 0, 640, 880);
  bgGrad.addColorStop(0, '#f0f7ff'); bgGrad.addColorStop(1, '#bfdbfe');
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, 640, 880);

  ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 10; ctx.strokeRect(20, 20, 600, 840);
  ctx.fillStyle = '#2563eb'; ctx.font = "900 34px sans-serif"; ctx.textAlign = 'center';
  ctx.fillText('かなゲーム · 日语单词闯关', 320, 90);
  ctx.font = "72px sans-serif"; ctx.fillText('🏆', 320, 180);
  ctx.fillStyle = '#0c2340'; ctx.font = "900 32px sans-serif"; ctx.fillText('通 关 荣 誉 证 书', 320, 240);

  const userNick = localStorage.getItem('tangogo_nickname') || '日语学习达人';
  ctx.font = "700 22px sans-serif"; ctx.fillStyle = '#1e4d8c'; ctx.fillText(`学员：${userNick}`, 320, 290);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(80, 340, 480, 340);
  ctx.fillStyle = '#64748b'; ctx.font = "700 18px sans-serif"; ctx.textAlign = 'left';
  ctx.fillText('⏱ 通关用时', 120, 410);
  ctx.fillText('📖 掌握词汇', 120, 470);
  ctx.fillText('🌟 最终得分', 120, 530);
  ctx.fillText('🎮 挑战模式', 120, 590);

  ctx.textAlign = 'right'; ctx.fillStyle = '#0c2340'; ctx.font = "900 20px sans-serif";
  ctx.fillText(timeSpent, 520, 410);
  ctx.fillText(`${totalWords} 词`, 520, 470);
  ctx.fillStyle = '#ea580c'; ctx.font = "900 26px sans-serif"; ctx.fillText(`${score} 分`, 520, 530);
  ctx.fillStyle = '#2563eb'; ctx.font = "900 20px sans-serif"; ctx.fillText('方块落格', 520, 590);

  setTimeout(() => {
    const a = document.createElement('a');
    a.href = cvs.toDataURL('image/png');
    a.download = `方块闯关成绩单_${Date.now()}.png`;
    a.click();
    showToast('🎉 成绩单图片已保存到本地！');
  }, 350);
}

function startWordPreview(word) {
  clearTimeout(tetPreviewTimer);
  cancelAnimationFrame(tetAnimId);
  tetPreviewing = true;

  const wrap = document.getElementById('tetris-preview');
  const kanaEl = document.getElementById('tetris-preview-kana');
  const barEl = document.getElementById('tetris-preview-bar');
  const hintBtn = document.getElementById('tet-hint');
  if (hintBtn) hintBtn.disabled = true;

  kanaEl.textContent = word.kana;
  wrap.hidden = false;

  const dur = Math.min(2600, Math.max(1600, tetKanaList.length * 380));
  barEl.style.transition = 'none'; barEl.style.width = '100%';
  void barEl.offsetWidth;
  barEl.style.transition = `width ${dur}ms linear`; barEl.style.width = '0%';
  drawTetris();

  tetPreviewTimer = setTimeout(() => {
    wrap.hidden = true;
    tetPreviewing = false;
    if (hintBtn) hintBtn.disabled = false;
    if (!tetRunning) return;
    spawnNextBlock();
    tetLastTime = performance.now();
    tetAnimId = requestAnimationFrame(tetrisLoop);
  }, dur);
}

function setupCanvas() {
  const wrap = document.getElementById('tetris-canvas-wrap');
  const canvas = document.getElementById('tetris-canvas');
  canvas.width = wrap.clientWidth || window.innerWidth;
  canvas.height = wrap.clientHeight || 360;
  const n = tetKanaList.length;
  tetSlotW = Math.max(48, Math.min(82, Math.floor((canvas.width - 32) / n)));
}

function renderSlots() {
  const row = document.getElementById('tet-slots-row');
  row.innerHTML = '';
  const n = tetKanaList.length;
  const activeTarget = (tetOrderMode === 'order' && tetCurrentBlock) ? tetCurrentBlock.targetSlot : -1;

  for (let i = 0; i < n; i++) {
    const slot = document.createElement('div');
    let cls = 'tetris-slot jp-text';
    if (tetSlotFilled[i]) cls += ' correct-slot';
    else if (i === tetHintSlot) cls += ' hint-slot';
    else if (i === activeTarget) cls += ' pending-slot';
    slot.className = cls;
    slot.style.width = tetSlotW + 'px';
    slot.id = 'tet-slot-' + i;

    if (tetSlotFilled[i]) {
      slot.textContent = tetKanaList[i];
    } else {
      const num = document.createElement('span');
      num.className = 'tetris-slot-num';
      num.textContent = i + 1;
      slot.appendChild(num);
    }
    row.appendChild(slot);
  }
}

function spawnNextBlock() {
  clearHint();
  const remaining = tetSlotFilled.filter(f => !f).length;
  if (remaining === 0) {
    sfxWordComplete();
    tetScore += 20 * tetLevel;
    document.getElementById('tet-score').textContent = tetScore;
    tetWordIdx++;
    setTimeout(() => { if (tetRunning) loadTetrisWord(); }, 600);
    return;
  }

  if (tetFallQueue.length === 0) tetFallQueue = buildFallQueue();
  const targetSlot = tetFallQueue.shift();
  const kana = tetKanaList[targetSlot];
  const n = tetKanaList.length;

  const validSlotsForThisKana = [];
  for (let i = 0; i < n; i++) {
    if (!tetSlotFilled[i] && tetKanaList[i] === kana) validSlotsForThisKana.push(i);
  }
  const nonTargetCols = [];
  for (let i = 0; i < n; i++) {
    if (!validSlotsForThisKana.includes(i)) nonTargetCols.push(i);
  }

  let startCol = nonTargetCols.length > 0
    ? nonTargetCols[Math.floor(Math.random() * nonTargetCols.length)]
    : Math.floor(Math.random() * n);

  tetCurrentBlock = { kana, targetSlot, col: startCol, y: -tetSlotW / 2, fast: false };
  renderSlots();
}

function getSlotX(colIdx) {
  const canvas = document.getElementById('tetris-canvas');
  const totalW = tetKanaList.length * tetSlotW;
  const startX = (canvas.width - totalW) / 2;
  return startX + colIdx * tetSlotW + tetSlotW / 2;
}

function tetrisLoop(now) {
  if (!tetRunning || tetPaused || tetPreviewing) return;
  const dt = Math.min((now - tetLastTime) / 1000, 0.1);
  tetLastTime = now;

  const canvas = document.getElementById('tetris-canvas');
  const baseSpeed = 58 + (tetLevel - 1) * 14;
  const speed = (tetCurrentBlock && tetCurrentBlock.fast) ? 680 : baseSpeed;

  if (tetCurrentBlock) {
    tetCurrentBlock.y += speed * dt;
    const groundY = canvas.height - tetSlotW / 2 + 4;
    if (tetCurrentBlock.y >= groundY) {
      landBlock();
    }
  }

  drawTetris();
  if (tetRunning && !tetPaused && !tetPreviewing) {
    tetAnimId = requestAnimationFrame(tetrisLoop);
  }
}

function landBlock() {
  if (!tetCurrentBlock) return;
  const { col, targetSlot, kana } = tetCurrentBlock;
  tetCurrentBlock = null;
  const slotEl = document.getElementById('tet-slot-' + col);

  if (!tetSlotFilled[col] && tetKanaList[col] === kana) {
    tetSlotFilled[col] = true;
    if (col !== targetSlot) {
      const idxInQueue = tetFallQueue.indexOf(col);
      if (idxInQueue !== -1) tetFallQueue[idxInQueue] = targetSlot;
      else if (!tetSlotFilled[targetSlot]) tetFallQueue.unshift(targetSlot);
    }

    tetScore += 10 * tetLevel;
    document.getElementById('tet-score').textContent = tetScore;
    if (tetSlotFilled.some(f => !f)) sfxLand();
    renderSlots();

    if (slotEl) {
      slotEl.classList.add('land-bounce');
      setTimeout(() => slotEl.classList.remove('land-bounce'), 400);
    }
    setTimeout(() => { if (tetRunning) spawnNextBlock(); }, 200);
  } else {
    sfxWrong();
    recordMistake(tetWords[tetWordIdx]);
    if (slotEl) {
      slotEl.classList.add('wrong-slot');
      setTimeout(() => slotEl.classList.remove('wrong-slot'), 450);
    }

    tetMistakes++;
    if (tetMistakes >= MAX_MISTAKES_PER_LIFE) {
      tetMistakes = 0; tetLives--;
      renderLives(); renderMistakes();
      if (tetLives <= 0) {
        tetRunning = false;
        cancelAnimationFrame(tetAnimId);
        sfxGameOver();
        const overlay = document.getElementById('overlay');
        document.getElementById('ov-emoji').textContent = '💔';
        document.getElementById('ov-title').textContent = '游戏结束';
        document.getElementById('ov-body').textContent = `生命已耗尽，本组得分：${tetScore} 分。`;
        document.getElementById('ov-stats').hidden = true;
        const actEl = document.getElementById('ov-actions');
        actEl.innerHTML = '';
        actEl.appendChild(createBtn('重试本组', 'btn-primary', () => { overlay.hidden = true; startGroup(currentGroupIndex); }));
        actEl.appendChild(createBtn('回到首页', 'btn-secondary', () => location.href = 'index.html'));
        overlay.hidden = false;
        return;
      }
      showToast(`💔 失误满 ${MAX_MISTAKES_PER_LIFE} 次，扣 1 颗心！`);
    } else {
      renderMistakes();
    }

    if (tetOrderMode === 'order') tetFallQueue.unshift(targetSlot);
    else tetFallQueue.splice(Math.floor(Math.random() * (tetFallQueue.length + 1)), 0, targetSlot);
    setTimeout(() => { if (tetRunning) spawnNextBlock(); }, 360);
  }
}

function drawTetris() {
  const canvas = document.getElementById('tetris-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const n = tetKanaList.length;
  if (n === 0) return;
  const totalW = n * tetSlotW;
  const startX = (canvas.width - totalW) / 2;

  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1; ctx.setLineDash([5, 7]);
  for (let i = 0; i <= n; i++) {
    const x = startX + i * tetSlotW;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  ctx.setLineDash([]);

  if (tetOrderMode === 'order' && tetCurrentBlock) {
    const tx = startX + tetCurrentBlock.targetSlot * tetSlotW;
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.fillRect(tx, 0, tetSlotW, canvas.height);
    const cx = tx + tetSlotW / 2;
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.moveTo(cx - 8, canvas.height - 10); ctx.lineTo(cx + 8, canvas.height - 10); ctx.lineTo(cx, canvas.height - 2); ctx.closePath(); ctx.fill();
  }

  if (tetHintSlot >= 0 && tetHintSlot < n) {
    const hx = startX + tetHintSlot * tetSlotW;
    ctx.fillStyle = 'rgba(253, 230, 138, 0.28)';
    ctx.fillRect(hx, 0, tetSlotW, canvas.height);
  }

  if (tetCurrentBlock) {
    const { col, y, kana } = tetCurrentBlock;
    const x = getSlotX(col);
    const size = tetSlotW - 8;
    const bx = x - size / 2; const by = y - size / 2;

    ctx.fillStyle = 'rgba(56, 189, 248, 0.22)';
    ctx.fillRect(startX + col * tetSlotW, 0, tetSlotW, canvas.height);

    ctx.save();
    ctx.shadowColor = 'rgba(249, 115, 22, 0.5)'; ctx.shadowBlur = 16;
    const grad = ctx.createLinearGradient(bx, by, bx + size, by + size);
    grad.addColorStop(0, '#fb923c'); grad.addColorStop(1, '#ea580c');
    ctx.fillStyle = grad;
    roundRect(ctx, bx, by, size, size, 16); ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 3;
    roundRect(ctx, bx, by, size, size, 16); ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.fillStyle = '#0c2340';
    ctx.font = `900 ${Math.floor(size * 0.52)}px 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(kana, x, y + 2);
    ctx.restore();
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

function moveLeft() {
  if (!tetCurrentBlock || !tetRunning || tetPaused || tetPreviewing) return;
  if (tetCurrentBlock.col > 0) { tetCurrentBlock.col--; sfxClick(); drawTetris(); }
}
function moveRight() {
  if (!tetCurrentBlock || !tetRunning || tetPaused || tetPreviewing) return;
  if (tetCurrentBlock.col < tetKanaList.length - 1) { tetCurrentBlock.col++; sfxClick(); drawTetris(); }
}
function triggerFastDrop() {
  if (!tetCurrentBlock || !tetRunning || tetPaused || tetPreviewing) return;
  tetCurrentBlock.fast = true; sfxClick();
}
function togglePause() {
  if (!tetRunning || tetPreviewing) return;
  tetPaused = !tetPaused;
  const pBtn = document.getElementById('tet-pause');
  const pLbl = document.getElementById('tet-pause-label');
  const ov = document.getElementById('tetris-pause-overlay');
  if (tetPaused) {
    cancelAnimationFrame(tetAnimId);
    pBtn.textContent = '▶'; pLbl.textContent = '继续'; ov.hidden = false;
  } else {
    pBtn.textContent = '⏸'; pLbl.textContent = '暂停'; ov.hidden = true;
    tetLastTime = performance.now(); tetAnimId = requestAnimationFrame(tetrisLoop);
  }
  sfxClick();
}

document.getElementById('mode-btn-random').addEventListener('click', () => setTetrisOrderMode('random'));
document.getElementById('mode-btn-order').addEventListener('click', () => setTetrisOrderMode('order'));
document.getElementById('tet-hint').addEventListener('click', useTetrisHint);
document.getElementById('tet-left').addEventListener('click', moveLeft);
document.getElementById('tet-right').addEventListener('click', moveRight);
document.getElementById('tet-pause').addEventListener('click', togglePause);
document.getElementById('tet-drop').addEventListener('click', triggerFastDrop);

document.addEventListener('keydown', e => {
  if (!tetRunning) return;
  if (e.key === 'p' || e.key === 'P') { e.preventDefault(); togglePause(); return; }
  if (tetPaused || tetPreviewing) return;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); moveLeft(); }
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); moveRight(); }
  else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S' || e.key === ' ') { e.preventDefault(); triggerFastDrop(); }
});

window.addEventListener('resize', () => {
  if (tetRunning) { setupCanvas(); renderSlots(); drawTetris(); }
});

window.addEventListener('DOMContentLoaded', async () => {
  await initAuth();
  lessonStartTime = Date.now();
  
  // 1. 动态拉取当前选中课时的全部单词
  FULL_LESSON_WORDS = await fetchCurrentLessonWords();
  totalGroups = Math.max(1, Math.ceil(FULL_LESSON_WORDS.length / GROUP_SIZE));
  
  // 2. 启动第一组
  startGroup(0);
});
</script>

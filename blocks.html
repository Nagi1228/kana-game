<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>かなゲーム - 方块模式</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: linear-gradient(180deg, #38bdf8 0%, #818cf8 55%, #c084fc 100%);
      user-select: none;
    }

    /* 原版顶部半透明状态栏 */
    .tetris-top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: rgba(0,0,0,0.18);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      z-index: 10;
    }
    .tet-back-btn {
      background: rgba(255,255,255,0.25);
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 24px;
      padding: 7px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
    }
    .tet-back-btn:hover { background: rgba(255,255,255,0.4); }
    .tetris-score {
      font-size: 1.05rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    .tetris-score span {
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 4px 12px;
      margin-left: 4px;
    }
    .tet-lives {
      margin-left: auto;
      font-size: 1.4rem;
      display: flex;
      gap: 4px;
    }

    /* 题目展示区 */
    .tetris-word-display {
      padding: 12px 20px;
      text-align: center;
      background: rgba(0,0,0,0.1);
      color: #fff;
      z-index: 10;
    }
    .tetris-kanji-hint {
      font-size: 2.2rem;
      font-weight: 900;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
      letter-spacing: 0.05em;
    }
    .tetris-meaning-hint {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.9);
      font-weight: 700;
      margin-top: 2px;
    }

    /* 核心舞台与下落区域 */
    .tetris-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    .tetris-canvas-wrap {
      flex: 1;
      width: 100%;
      max-width: 500px;
      position: relative;
    }
    
    /* 下落的大假名卡片 */
    .falling-kana {
      position: absolute;
      top: 0;
      width: 68px;
      height: 68px;
      background: rgba(255,255,255,0.95);
      border: 3px solid #3b82f6;
      border-radius: 18px;
      color: #1e3a8a;
      font-size: 2rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      transform: translateX(-50%);
      transition: left 0.12s ease-out;
    }

    /* 底部凹槽接盘 */
    .tetris-ground {
      width: 100%;
      max-width: 500px;
      padding-bottom: 8px;
      background: rgba(0,0,0,0.08);
      border-top: 2px solid rgba(255,255,255,0.25);
    }
    .tetris-slots-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px 0;
    }
    .tetris-slot {
      flex: 1;
      height: 64px;
      border: 2.5px solid rgba(255,255,255,0.5);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 900;
      color: #fff;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(6px);
      transition: all 0.15s ease;
    }
    .tetris-slot.active {
      background: rgba(37,99,235,0.85);
      border-color: #fff;
      box-shadow: 0 0 16px rgba(255,255,255,0.6);
      transform: scale(1.04);
    }

    /* 原版大圆控制按钮区 */
    .tetris-controls {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      padding: 14px 20px;
      background: rgba(0,0,0,0.18);
      z-index: 10;
    }
    .ctrl-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .tetris-ctrl-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(6px);
      font-size: 1.6rem;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      transition: all 0.1s;
    }
    .tetris-ctrl-btn:active {
      background: rgba(255,255,255,0.45);
      transform: scale(0.92);
    }
    .ctrl-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: rgba(255,255,255,0.8);
    }
  </style>
</head>
<body>

  <div class="tetris-top">
    <button class="tet-back-btn" onclick="location.href='index.html'">← 返回</button>
    <span class="tetris-score">得分<span id="tet-score">0</span></span>
    <span class="tetris-score">关卡<span id="tet-level">1</span></span>
    <div class="tet-lives" id="tet-lives">❤️❤️❤️</div>
  </div>

  <div class="tetris-word-display">
    <div class="tetris-kanji-hint" id="tet-kanji">正在载入...</div>
    <div class="tetris-meaning-hint" id="tet-meaning"></div>
  </div>

  <div class="tetris-main">
    <div class="tetris-canvas-wrap" id="canvasWrap">
      <div class="falling-kana" id="fallingKana">あ</div>
    </div>
    <div class="tetris-ground">
      <div class="tetris-slots-row">
        <div class="tetris-slot" id="slot-0">轨道 1</div>
        <div class="tetris-slot" id="slot-1">轨道 2</div>
        <div class="tetris-slot" id="slot-2">轨道 3</div>
      </div>
    </div>
  </div>

  <div class="tetris-controls">
    <div class="ctrl-col">
      <button class="tetris-ctrl-btn" onclick="moveLeft()">◀</button>
      <div class="ctrl-label">左移 (A)</div>
    </div>
    <div class="ctrl-col">
      <button class="tetris-ctrl-btn" onclick="quickDrop()">⬇</button>
      <div class="ctrl-label">快落 (S)</div>
    </div>
    <div class="ctrl-col">
      <button class="tetris-ctrl-btn" onclick="moveRight()">▶</button>
      <div class="ctrl-label">右移 (D)</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zbfjbtzvnhmfzyvooact.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_AP0YnQLgzmB3d63_4zbpjg_vHeTyo8Z';
    const sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    let currentUser = null;
    let score = 0;
    let level = 1;
    let lives = 3;
    let currentTrack = 1; // 0, 1, 2
    let targetTrack = 1;
    let blockY = 0;
    let dropSpeed = 1.8;
    let animId = null;

    const blockList = [
      { kanji: '先生', kana: 'せんせい', meaning: '老师' },
      { kanji: '学生', kana: 'がくせい', meaning: '学生' },
      { kanji: '友達', kana: 'ともだち', meaning: '朋友' },
      { kanji: 'テスト', kana: 'テスト', meaning: '测验，测试' },
      { kanji: '本', kana: 'ほん', meaning: '书' }
    ];
    let qIndex = 0;

    async function initAuth() {
      if (!sbClient) return;
      const { data: { session } } = await sbClient.auth.getSession();
      if (session) currentUser = session.user;
    }

    async function recordMistake(word) {
      let localMistakes = JSON.parse(localStorage.getItem('tangogo_mistakes') || '[]');
      if (!localMistakes.some(m => m.word === word.kana)) {
        localMistakes.push({ word: word.kana, meaning: word.meaning });
        localStorage.setItem('tangogo_mistakes', JSON.stringify(localMistakes));
      }
      if (currentUser && sbClient) {
        try {
          await sbClient.from('user_mistakes').upsert({
            user_id: currentUser.id,
            word: word.kana,
            meaning: word.meaning,
            wrong_count: 1,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id,word' });
        } catch (e) { console.error(e); }
      }
    }

    const trackPercents = ['16.6%', '50%', '83.3%'];

    function updateTrackUI() {
      for (let i = 0; i < 3; i++) {
        document.getElementById(`slot-${i}`).classList.toggle('active', i === currentTrack);
      }
      document.getElementById('fallingKana').style.left = trackPercents[currentTrack];
    }

    function moveLeft() {
      if (currentTrack > 0) { currentTrack--; updateTrackUI(); }
    }

    function moveRight() {
      if (currentTrack < 2) { currentTrack++; updateTrackUI(); }
    }

    function quickDrop() {
      dropSpeed = 9;
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft();
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight();
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') quickDrop();
    });

    function spawnNext() {
      if (qIndex >= blockList.length) qIndex = 0;
      const q = blockList[qIndex];
      document.getElementById('tet-kanji').innerText = q.kanji;
      document.getElementById('tet-meaning').innerText = q.meaning;
      document.getElementById('fallingKana').innerText = q.kana;

      targetTrack = Math.floor(Math.random() * 3);
      currentTrack = 1;
      blockY = 0;
      dropSpeed = 1.8;
      updateTrackUI();

      if (animId) cancelAnimationFrame(animId);
      animate();
    }

    function animate() {
      const wrap = document.getElementById('canvasWrap');
      const maxH = wrap.clientHeight - 70;

      blockY += dropSpeed;
      document.getElementById('fallingKana').style.top = `${blockY}px`;

      if (blockY >= maxH) {
        // 到达底部判定
        if (currentTrack === targetTrack) {
          score += 10;
          document.getElementById('tet-score').innerText = score;
        } else {
          lives--;
          document.getElementById('tet-lives').innerText = '❤️'.repeat(Math.max(0, lives));
          recordMistake(blockList[qIndex]);

          if (lives <= 0) {
            alert('💔 生命值耗尽，游戏结束！');
            location.reload();
            return;
          }
        }
        qIndex++;
        setTimeout(spawnNext, 300);
      } else {
        animId = requestAnimationFrame(animate);
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await initAuth();
      spawnNext();
    });
  </script>
</body>
</html>

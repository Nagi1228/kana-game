<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かなゲーム - 拼图模式</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=M+PLUS+Rounded+1c:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&display=swap">
<style>
:root {
  --bg: #f0f7ff;
  --bg2: #dbeafe;
  --bg3: #bfdbfe;
  --surface: #ffffff;
  --surface2: #f8faff;
  --border: #93c5fd;
  --fg: #0c2340;
  --fg2: #1e4d8c;
  --fg3: #2563eb;
  --accent: #2563eb;
  --accent2: #3b82f6;
  --accent-hot: #f97316;
  --accent-fg: #ffffff;
  --correct: #059669;
  --correct-bg: #d1fae5;
  --wrong: #e11d48;
  --wrong-bg: #ffe4e6;
  --warn: #d97706;
  --warn-bg: #fef3c7;
  --shadow: rgba(37,99,235,0.18);
  --shadow-hot: rgba(249,115,22,0.22);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  font-family: 'Noto Sans SC', sans-serif;
  background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
  color: var(--fg);
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  user-select: none;
}
.jp-text { font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif; }
.cn-text { font-family: 'Noto Sans SC', sans-serif; }
[hidden] { display: none !important; }

.top-nav {
  display: flex; align-items: center; gap: 10px; padding: 12px 24px;
  background-color: var(--surface);
  border-bottom: 2px solid var(--border);
  box-shadow: 0 2px 12px var(--shadow);
  position: sticky; top: 0; z-index: 50;
}
.nav-logo { font-size: 1.6rem; font-weight: 900; color: var(--accent); cursor: pointer; }
.nav-logo span { color: var(--accent-hot); }

.sort-game {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 24px 16px; gap: 18px;
}
.game-header { width: 100%; max-width: 840px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.back-btn {
  background: var(--surface); border: 2px solid var(--border); border-radius: 24px;
  padding: 8px 16px; font-size: 0.95rem; font-weight: 700; color: var(--fg2);
  cursor: pointer; transition: border-color 0.15s, color 0.15s; white-space: nowrap;
}
.back-btn:hover { border-color: var(--accent); color: var(--accent); }
.progress-row { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 140px; }
.progress-bar { flex: 1; height: 10px; background: var(--bg3); border-radius: 5px; overflow: hidden; min-width: 0; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-hot)); border-radius: 5px; transition: width 0.4s ease; width: 10%; }
.score-chip {
  background: var(--bg2); border-radius: 24px; padding: 6px 16px; font-size: 1rem;
  font-weight: 700; color: var(--fg2); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.score-chip.big { font-size: 1.1rem; color: var(--accent-hot); background: var(--surface); border: 2px solid var(--border); }
.score-chip.level-chip { color: var(--accent); background: var(--surface); border: 2px solid var(--border); }

/* 限时控制栏 */
.timer-toggle-row {
  width: 100%; max-width: 840px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--surface); border-radius: 16px; padding: 10px 16px;
  border: 2px solid var(--border); box-shadow: 0 2px 8px var(--shadow);
}
.timer-toggle-label { font-size: 0.9rem; font-weight: 700; color: var(--fg2); margin-right: 4px; }
.timer-opt-btn {
  padding: 7px 16px; border-radius: 20px; border: 2px solid var(--border);
  background: var(--surface); font-size: 0.88rem; font-weight: 700;
  color: var(--fg2); cursor: pointer; transition: all 0.15s;
}
.timer-opt-btn:hover { border-color: var(--accent); color: var(--accent); }
.timer-opt-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.sort-timer-wrap { width: 100%; max-width: 840px; display: flex; flex-direction: column; gap: 6px; }
.sort-timer-wrap[hidden] { display: none !important; }
.sort-timer-row { display: flex; align-items: center; gap: 12px; }
#sort-timer-num { font-size: 1.5rem; font-weight: 900; color: var(--accent-hot); font-variant-numeric: tabular-nums; min-width: 44px; }
.sort-timer-bar { flex: 1; height: 12px; background: var(--bg3); border-radius: 6px; overflow: hidden; }
#sort-timer-fill { height: 100%; border-radius: 6px; transition: width 0.9s linear, background-color 0.5s; background: #22c55e; width: 100%; }

/* 单词展示卡片 */
.word-card {
  width: 100%; max-width: 840px; background: var(--surface); border-radius: 24px;
  padding: 28px 32px; text-align: center; box-shadow: 0 6px 28px var(--shadow);
  border: 2px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.word-kanji { font-size: clamp(2.6rem, 5.5vw, 4.2rem); font-weight: 900; color: var(--fg); line-height: 1.15; min-height: 52px; }
.word-meta-badges { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.meta-badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 14px; border-radius: 20px; font-size: 0.95rem; font-weight: 800; }
.meta-badge.pitch-badge { background: var(--warn-bg); color: var(--warn); border: 1.5px solid rgba(217,119,6,0.35); }
.meta-badge.pos-badge { background: var(--bg2); color: var(--accent); border: 1.5px solid var(--border); }
.word-meaning { font-size: 1.45rem; color: var(--fg2); font-weight: 800; }
.word-hint { font-size: 0.88rem; color: var(--fg3); font-weight: 700; }

/* 填空插槽 */
.answer-zone {
  width: 100%; max-width: 840px; display: flex; justify-content: center;
  gap: 12px; min-height: 80px; align-items: center; flex-wrap: wrap;
}
.slot {
  width: 72px; height: 72px; border-radius: 18px; border: 3px dashed var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.9rem; font-weight: 900; color: var(--fg); background: var(--surface2);
  cursor: pointer; transition: border-color 0.15s, background 0.15s, transform 0.1s;
  user-select: none; position: relative; flex-shrink: 0;
}
.slot.filled { border-style: solid; border-color: var(--accent); background: var(--bg2); box-shadow: 0 2px 10px var(--shadow); }
.slot.correct { border-color: var(--correct); background: var(--correct-bg); color: var(--correct); animation: pop-in 0.35s cubic-bezier(0.175,0.885,0.32,1.4); }
.slot.wrong { border-color: var(--wrong); background: var(--wrong-bg); color: var(--wrong); animation: shake 0.4s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
@keyframes pop-in { 0%{transform:scale(0.6)} 70%{transform:scale(1.18)} 100%{transform:scale(1)} }
.slot-num { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); font-size: 0.6rem; font-weight: 700; color: var(--fg3); opacity: 0.5; }

/* 假名按钮池 */
.kana-pool { width: 100%; max-width: 840px; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
.kana-btn {
  width: 72px; height: 72px; border-radius: 18px; border: 3px solid var(--border);
  background: var(--surface); font-size: 1.8rem; font-weight: 900;
  color: var(--fg); cursor: pointer; transition: all 0.12s;
  user-select: none; box-shadow: 0 3px 10px var(--shadow); flex-shrink: 0;
}
.kana-btn:hover:not(:disabled):not(.used) { border-color: var(--accent); background: var(--bg2); transform: translateY(-3px) scale(1.06); box-shadow: 0 8px 20px var(--shadow); }
.kana-btn:active:not(:disabled):not(.used) { transform: scale(0.95); }
.kana-btn.used { opacity: 0.22; cursor: default; pointer-events: none; }

.sort-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.action-btn {
  padding: 12px 26px; border-radius: 28px; border: none;
  font-size: 1rem; font-weight: 700; cursor: pointer; transition: transform 0.1s, box-shadow 0.15s;
}
.action-btn:active { transform: scale(0.96); }
.btn-primary { background: linear-gradient(135deg, var(--accent), #1d4ed8); color: #fff; box-shadow: 0 4px 16px var(--shadow); }
.btn-hot { background: linear-gradient(135deg, var(--accent-hot), #ea580c); color: #fff; }
.btn-secondary { background: var(--surface); color: var(--fg2); border: 2.5px solid var(--border); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

.result-message {
  font-size: 1.25rem; font-weight: 700; text-align: center; padding: 16px 24px;
  border-radius: 16px; width: 100%; max-width: 840px;
}
.result-message.success { background: var(--correct-bg); color: var(--correct); }
.result-message.fail { background: var(--wrong-bg); color: var(--wrong); }

/* 原生 Toast 与 通关 Overlay */
.toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--fg); color: #fff; border-radius: 28px; padding: 12px 26px;
  font-size: 1rem; font-weight: 700; opacity: 0; transition: all 0.25s ease; z-index: 300; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center;
  z-index: 200; padding: 20px; backdrop-filter: blur(8px);
}
.overlay-card {
  background: var(--surface); border-radius: 28px; padding: 34px 28px; text-align: center;
  width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 24px 70px rgba(0,0,0,0.35); border: 2px solid var(--border);
}
.overlay-emoji { font-size: 3.2rem; }
.overlay-title { font-size: 1.8rem; font-weight: 900; }
.overlay-body { font-size: 1rem; color: var(--fg2); line-height: 1.65; }
.overlay-stats-box {
  background: var(--bg); border-radius: 16px; padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; font-size: 0.9rem; font-weight: 700; text-align: left;
}
.overlay-stats-item b { color: var(--accent); }
.overlay-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
</style>
</head>
<body>

  <nav class="top-nav">
    <div class="nav-logo jp-text" onclick="location.href='index.html'">かな<span>ゲーム</span></div>
  </nav>

  <div class="sort-game">
    <div class="game-header">
      <button class="back-btn cn-text" onclick="location.href='index.html'">← 返回</button>
      <span class="score-chip level-chip cn-text" id="groupBadge">第 1 关</span>
      <div class="progress-row">
        <div class="progress-bar"><div class="progress-fill" id="sort-progress"></div></div>
        <span class="score-chip" id="sort-counter">1/10</span>
      </div>
      <span class="score-chip big cn-text" id="sort-score">0分</span>
    </div>

    <div class="timer-toggle-row">
      <span class="timer-toggle-label cn-text">⏱ 限时</span>
      <button class="timer-opt-btn cn-text active" onclick="setTimerSecs(0, this)">关闭</button>
      <button class="timer-opt-btn cn-text" onclick="setTimerSecs(15, this)">15秒</button>
      <button class="timer-opt-btn cn-text" onclick="setTimerSecs(30, this)">30秒</button>
      <button class="timer-opt-btn cn-text" onclick="setTimerSecs(45, this)">45秒</button>
    </div>

    <div class="sort-timer-wrap" id="sort-timer-wrap" hidden>
      <div class="sort-timer-row">
        <span id="sort-timer-num">15</span>
        <div class="sort-timer-bar"><div id="sort-timer-fill"></div></div>
      </div>
    </div>

    <div class="word-card">
      <div class="word-kanji jp-text" id="sort-kanji">测验，测试</div>
      <div class="word-meta-badges">
        <span class="meta-badge pitch-badge cn-text" id="sort-pitch">声调: ①</span>
        <span class="meta-badge pos-badge cn-text" id="sort-pos">词性: 名词</span>
      </div>
      <div class="word-meaning cn-text" id="sort-meaning">测验，测试</div>
      <div class="word-hint cn-text" id="sort-hint">共 3 个假名</div>
    </div>

    <div class="answer-zone" id="sort-answer-zone"></div>
    <div class="kana-pool jp-text" id="sort-kana-pool"></div>

    <div class="sort-actions">
      <button class="action-btn btn-secondary cn-text" onclick="undoLast()">↩ 撤销</button>
      <button class="action-btn btn-secondary cn-text" onclick="resetSlots()">🔄 重置</button>
    </div>

    <div class="result-message cn-text" id="sort-result" hidden></div>
  </div>

  <!-- 原生通关/结束弹窗 -->
  <div class="overlay" id="overlay" hidden>
    <div class="overlay-card">
      <div class="overlay-emoji" id="ov-emoji">🏆</div>
      <div class="overlay-title cn-text" id="ov-title">整课大通关！</div>
      <div class="overlay-body cn-text" id="ov-body"></div>
      <div class="overlay-stats-box" id="ov-stats" hidden></div>
      <div class="overlay-actions" id="ov-actions"></div>
    </div>
  </div>

  <div class="toast cn-text" id="toast"></div>

  <script>
    const SUPABASE_URL = 'https://zbfjbtzvnhmfzyvooact.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_AP0YnQLgzmB3d63_4zbpjg_vHeTyo8Z';
    const sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
    let currentUser = null;

    async function initAuth() {
      if (!sbClient) return;
      const { data: { session } } = await sbClient.auth.getSession();
      if (session) currentUser = session.user;
    }

    async function recordMistake(word) {
      let localMistakes = JSON.parse(localStorage.getItem('tangogo_mistakes') || '[]');
      if (!localMistakes.some(m => m.word === word.kana)) {
        localMistakes.push({ word: word.kana, meaning: word.meaning });
        localStorage.setItem('tangogo_mistakes', JSON.stringify(localMistakes));
      }
      if (currentUser && sbClient) {
        try {
          await sbClient.from('user_mistakes').upsert({
            user_id: currentUser.id,
            word: word.kana,
            meaning: word.meaning,
            wrong_count: 1,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id,word' });
        } catch (e) { console.error(e); }
      }
    }

    // 本课完整生词库（按每组 10 词划分）
    const FULL_LESSON_WORDS = [
      { kanji: '本', kana: 'ほん', pitch: '①', pos: '名词', meaning: '书' },
      { kanji: '', kana: 'かばん', pitch: '⓪', pos: '名词', meaning: '包，公文包' },
      { kanji: '', kana: 'ノート', pitch: '①', pos: '名词', meaning: '笔记本，本子' },
      { kanji: '鉛筆', kana: 'えんぴつ', pitch: '⓪', pos: '名词', meaning: '铅笔' },
      { kanji: '傘', kana: 'かさ', pitch: '①', pos: '名词', meaning: '伞' },
      { kanji: '靴', kana: 'くつ', pitch: '②', pos: '名词', meaning: '鞋' },
      { kanji: '新聞', kana: 'しんぶん', pitch: '⓪', pos: '名词', meaning: '报纸' },
      { kanji: '雑誌', kana: 'ざっし', pitch: '⓪', pos: '名词', meaning: '杂志' },
      { kanji: '辞書', kana: 'じしょ', pitch: '①', pos: '名词', meaning: '词典' },
      { kanji: '', kana: 'カメラ', pitch: '①', pos: '名词', meaning: '照相机' },
      // 第 2 组 (11~20)
      { kanji: '', kana: 'テレビ', pitch: '①', pos: '名词', meaning: '电视机' },
      { kanji: '', kana: 'パソコン', pitch: '②', pos: '名词', meaning: '个人电脑' },
      { kanji: '', kana: 'ラジオ', pitch: '①', pos: '名词', meaning: '收音机' },
      { kanji: '電話', kana: 'でんわ', pitch: '⓪', pos: '名词', meaning: '电话' },
      { kanji: '机', kana: 'つくえ', pitch: '⓪', pos: '名词', meaning: '桌子，书桌' },
      { kanji: '', kana: 'いす', pitch: '⓪', pos: '名词', meaning: '椅子' },
      { kanji: '', kana: 'かぎ', pitch: '②', pos: '名词', meaning: '钥匙，锁' },
      { kanji: '時計', kana: 'とけい', pitch: '⓪', pos: '名词', meaning: '钟，表' },
      { kanji: '手帳', kana: 'てちょう', pitch: '⓪', pos: '名词', meaning: '记事本' },
      { kanji: '写真', kana: 'しゃしん', pitch: '⓪', pos: '名词', meaning: '照片' },
      // 第 3 组 (21~25)
      { kanji: '車', kana: 'くるま', pitch: '⓪', pos: '名词', meaning: '车' },
      { kanji: '自転車', kana: 'じてんしゃ', pitch: '②', pos: '名词', meaning: '自行车' },
      { kanji: 'お土産', kana: 'おみやげ', pitch: '⓪', pos: '名词', meaning: '礼物' },
      { kanji: '会社', kana: 'かいしゃ', pitch: '⓪', pos: '名词', meaning: '公司' },
      { kanji: '日本語', kana: 'にほんご', pitch: '⓪', pos: '名词', meaning: '日语' }
    ];

    const GROUP_SIZE = 10;
    let currentGroupIndex = 0;
    const totalGroups = Math.ceil(FULL_LESSON_WORDS.length / GROUP_SIZE);

    let currentGroupWords = [];
    let currentIndex = 0;
    let currentInput = [];
    let score = 0;
    let lessonScoreTotal = 0;
    let lessonStartTime = Date.now();

    let timerSecs = 0;
    let timerInterval = null;
    let timeLeft = 0;
    let toastTimer = null;

    function showToast(msg, duration = 2200) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), duration);
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startGroup(groupIdx) {
      currentGroupIndex = groupIdx;
      const start = groupIdx * GROUP_SIZE;
      const end = Math.min(start + GROUP_SIZE, FULL_LESSON_WORDS.length);
      currentGroupWords = shuffle(FULL_LESSON_WORDS.slice(start, end));
      currentIndex = 0;
      score = 0;

      document.getElementById('groupBadge').innerText = `第 ${currentGroupIndex + 1}/${totalGroups} 组`;
      document.getElementById('sort-score').innerText = `${score}分`;
      loadQuestion();
    }

    function setTimerSecs(secs, btn) {
      timerSecs = secs;
      document.querySelectorAll('.timer-opt-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const wrap = document.getElementById('sort-timer-wrap');
      if (secs === 0) {
        wrap.hidden = true;
        clearInterval(timerInterval);
      } else {
        wrap.hidden = false;
        startTimer();
      }
    }

    function startTimer() {
      clearInterval(timerInterval);
      if (timerSecs === 0) return;
      timeLeft = timerSecs;
      updateTimerUI();
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerUI();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeout();
        }
      }, 1000);
    }

    function updateTimerUI() {
      document.getElementById('sort-timer-num').innerText = timeLeft;
      const pct = (timeLeft / timerSecs) * 100;
      const fill = document.getElementById('sort-timer-fill');
      fill.style.width = `${pct}%`;
      fill.style.background = pct > 40 ? '#22c55e' : (pct > 20 ? '#f59e0b' : '#ef4444');
    }

    function handleTimeout() {
      const q = currentGroupWords[currentIndex];
      const res = document.getElementById('sort-result');
      res.hidden = false;
      res.className = 'result-message fail';
      res.innerText = `⏰ 时间到！正确是: ${q.kana}（已加入错题本）`;
      recordMistake(q);
      setTimeout(() => {
        currentIndex++;
        loadQuestion();
      }, 1500);
    }

    function loadQuestion() {
      if (currentIndex >= currentGroupWords.length) {
        clearInterval(timerInterval);
        lessonScoreTotal += score;
        handleGroupOrLessonComplete();
        return;
      }

      const q = currentGroupWords[currentIndex];
      currentInput = [];
      document.getElementById('sort-result').hidden = true;

      document.getElementById('sort-counter').innerText = `${currentIndex + 1}/${currentGroupWords.length}`;
      document.getElementById('sort-progress').style.width = `${((currentIndex + 1) / currentGroupWords.length) * 100}%`;

      const hasKanji = q.kanji && q.kanji.trim() !== '' && q.kanji.trim() !== q.kana.trim();
      document.getElementById('sort-kanji').innerText = hasKanji ? q.kanji : '——';
      document.getElementById('sort-pitch').innerText = `声调: ${q.pitch || '⓪'}`;
      document.getElementById('sort-pos').innerText = `词性: ${q.pos || '名'}`;
      document.getElementById('sort-meaning').innerText = q.meaning;
      document.getElementById('sort-hint').innerText = `共 ${q.kana.length} 个假名`;

      const ansZone = document.getElementById('sort-answer-zone');
      ansZone.innerHTML = '';
      for (let i = 0; i < q.kana.length; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.id = `slot-${i}`;
        slot.innerHTML = `<span class="slot-num">${i + 1}</span><span class="slot-val"></span>`;
        slot.onclick = () => removeSlotLetter(i);
        ansZone.appendChild(slot);
      }

      const chars = q.kana.split('').sort(() => Math.random() - 0.5);
      const pool = document.getElementById('sort-kana-pool');
      pool.innerHTML = '';
      chars.forEach((char, idx) => {
        const btn = document.createElement('button');
        btn.className = 'kana-btn';
        btn.id = `kana-btn-${idx}`;
        btn.innerText = char;
        btn.onclick = () => selectLetter(char, idx);
        pool.appendChild(btn);
      });

      startTimer();
    }

    function selectLetter(char, btnIdx) {
      const q = currentGroupWords[currentIndex];
      if (currentInput.length >= q.kana.length) return;

      currentInput.push({ char, btnIdx });
      document.getElementById(`kana-btn-${btnIdx}`).classList.add('used');
      renderSlots();

      if (currentInput.length === q.kana.length) {
        checkAnswer();
      }
    }

    function removeSlotLetter(slotIdx) {
      if (!currentInput[slotIdx]) return;
      const removed = currentInput.splice(slotIdx, 1)[0];
      document.getElementById(`kana-btn-${removed.btnIdx}`).classList.remove('used');
      renderSlots();
    }

    function undoLast() {
      if (currentInput.length === 0) return;
      const removed = currentInput.pop();
      document.getElementById(`kana-btn-${removed.btnIdx}`).classList.remove('used');
      renderSlots();
    }

    function resetSlots() {
      currentInput.forEach(item => {
        document.getElementById(`kana-btn-${item.btnIdx}`).classList.remove('used');
      });
      currentInput = [];
      renderSlots();
    }

    function renderSlots() {
      const q = currentGroupWords[currentIndex];
      for (let i = 0; i < q.kana.length; i++) {
        const slot = document.getElementById(`slot-${i}`);
        const valEl = slot.querySelector('.slot-val');
        if (currentInput[i]) {
          valEl.innerText = currentInput[i].char;
          slot.classList.add('filled');
        } else {
          valEl.innerText = '';
          slot.classList.remove('filled');
        }
      }
    }

    function checkAnswer() {
      const q = currentGroupWords[currentIndex];
      const ans = currentInput.map(item => item.char).join('');
      const res = document.getElementById('sort-result');
      res.hidden = false;

      if (ans === q.kana) {
        clearInterval(timerInterval);
        res.className = 'result-message success';
        res.innerText = '✨ 正确！+10分';
        score += 10;
        document.getElementById('sort-score').innerText = `${score}分`;
        for (let i = 0; i < q.kana.length; i++) {
          document.getElementById(`slot-${i}`).classList.add('correct');
        }
        setTimeout(() => {
          currentIndex++;
          loadQuestion();
        }, 800);
      } else {
        clearInterval(timerInterval);
        res.className = 'result-message fail';
        res.innerText = `❌ 拼错啦，正确是: ${q.kana}（已加入错题本）`;
        for (let i = 0; i < q.kana.length; i++) {
          document.getElementById(`slot-${i}`).classList.add('wrong');
        }
        recordMistake(q);
        setTimeout(() => {
          currentIndex++;
          loadQuestion();
        }, 1500);
      }
    }

    // 核心分组与整课通关流
    function handleGroupOrLessonComplete() {
      if (currentGroupIndex < totalGroups - 1) {
        // 还有下一组：平滑通知并自动切入下一组
        showToast(`🎉 第 ${currentGroupIndex + 1} 组完成！准备进入下一组...`);
        setTimeout(() => {
          startGroup(currentGroupIndex + 1);
        }, 1200);
      } else {
        // 整课通关：展示大弹窗与4个功能按钮
        const totalSeconds = Math.max(1, Math.round((Date.now() - lessonStartTime) / 1000));
        const m = Math.floor(totalSeconds / 60); const s = totalSeconds % 60;
        const timeFormatted = `${m > 0 ? m + '分' : ''}${s}秒`;

        const overlay = document.getElementById('overlay');
        document.getElementById('ov-body').textContent = `太棒了！本课全部 ${FULL_LESSON_WORDS.length} 个单词已全部拼图通关！`;
        const statsEl = document.getElementById('ov-stats');
        statsEl.hidden = false;
        statsEl.innerHTML = `
          <div class="overlay-stats-item">总得分：<b>${lessonScoreTotal} 分</b></div>
          <div class="overlay-stats-item">总用时：<b>${timeFormatted}</b></div>
          <div class="overlay-stats-item">总词数：<b>${FULL_LESSON_WORDS.length} 词</b></div>
          <div class="overlay-stats-item">挑战状态：<b>全完成 ✨</b></div>
        `;

        const actEl = document.getElementById('ov-actions');
        actEl.innerHTML = '';

        actEl.appendChild(createBtn('下一课', 'btn-primary', () => {
          showToast('正在前往下一课...');
          setTimeout(() => location.href = 'puzzle.html?lesson=unit1_lesson2', 500);
        }));
        actEl.appendChild(createBtn('再来1遍', 'btn-secondary', () => {
          overlay.hidden = true;
          lessonStartTime = Date.now();
          lessonScoreTotal = 0;
          startGroup(0);
        }));
        actEl.appendChild(createBtn('📸 分享成绩', 'btn-hot', () => generateShareCard(lessonScoreTotal, timeFormatted, FULL_LESSON_WORDS.length)));
        actEl.appendChild(createBtn('回到首页', 'btn-secondary', () => location.href = 'index.html'));

        overlay.hidden = false;
      }
    }

    function createBtn(text, cls, onClick) {
      const b = document.createElement('button');
      b.className = 'action-btn cn-text ' + cls;
      b.textContent = text;
      b.onclick = onClick;
      return b;
    }

    function generateShareCard(score, timeSpent, totalWords) {
      showToast('正在生成成绩单图片...');
      const cvs = document.createElement('canvas');
      cvs.width = 640; cvs.height = 840;
      const ctx = cvs.getContext('2d');
      const bgGrad = ctx.createLinearGradient(0, 0, 640, 840);
      bgGrad.addColorStop(0, '#f0f7ff'); bgGrad.addColorStop(1, '#bfdbfe');
      ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, 640, 840);

      ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 10; ctx.strokeRect(20, 20, 600, 800);
      ctx.fillStyle = '#2563eb'; ctx.font = "900 34px sans-serif"; ctx.textAlign = 'center';
      ctx.fillText('かなゲーム · 拼图闯关', 320, 90);
      ctx.font = "72px sans-serif"; ctx.fillText('🏆', 320, 180);
      ctx.fillStyle = '#0c2340'; ctx.font = "900 32px sans-serif"; ctx.fillText('通 关 荣 誉 证 书', 320, 240);

      const userNick = localStorage.getItem('tangogo_nickname') || '日语学员';
      ctx.font = "700 22px sans-serif"; ctx.fillStyle = '#1e4d8c'; ctx.fillText(`学员：${userNick}`, 320, 290);

      ctx.fillStyle = '#ffffff'; ctx.fillRect(80, 330, 480, 320);
      ctx.fillStyle = '#64748b'; ctx.font = "700 18px sans-serif"; ctx.textAlign = 'left';
      ctx.fillText('⏱ 通关用时', 120, 400);
      ctx.fillText('📖 掌握词汇', 120, 460);
      ctx.fillText('🌟 最终得分', 120, 520);
      ctx.fillText('🎮 挑战模式', 120, 580);

      ctx.textAlign = 'right'; ctx.fillStyle = '#0c2340'; ctx.font = "900 20px sans-serif";
      ctx.fillText(timeSpent, 520, 400);
      ctx.fillText(`${totalWords} 词`, 520, 460);
      ctx.fillStyle = '#ea580c'; ctx.font = "900 26px sans-serif"; ctx.fillText(`${score} 分`, 520, 520);
      ctx.fillStyle = '#2563eb'; ctx.font = "900 20px sans-serif"; ctx.fillText('拼图模式', 520, 580);

      setTimeout(() => {
        const a = document.createElement('a');
        a.href = cvs.toDataURL('image/png');
        a.download = `拼图闯关成绩单_${Date.now()}.png`;
        a.click();
        showToast('🎉 成绩单图片已保存到本地！');
      }, 350);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await initAuth();
      lessonStartTime = Date.now();
      startGroup(0);
    });
  </script>
</body>
</html>

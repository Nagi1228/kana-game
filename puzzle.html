<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かなゲーム - 拼图模式</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #f0f7ff;
  --bg2: #dbeafe;
  --bg3: #bfdbfe;
  --surface: #ffffff;
  --surface2: #f8faff;
  --border: #93c5fd;
  --fg: #0c2340;
  --fg2: #1e4d8c;
  --fg3: #2563eb;
  --accent: #2563eb;
  --accent2: #3b82f6;
  --accent-hot: #f97316;
  --accent-fg: #ffffff;
  --correct: #059669;
  --correct-bg: #d1fae5;
  --wrong: #e11d48;
  --wrong-bg: #ffe4e6;
  --warn: #d97706;
  --warn-bg: #fef3c7;
  --shadow: rgba(37,99,235,0.18);
  --shadow-hot: rgba(249,115,22,0.22);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
  color: var(--fg);
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}

.top-nav {
  display: flex; align-items: center; gap: 10px; padding: 12px 24px;
  background-color: var(--surface);
  border-bottom: 2px solid var(--border);
  box-shadow: 0 2px 12px var(--shadow);
  position: sticky; top: 0; z-index: 50;
}
.nav-logo { font-size: 1.6rem; font-weight: 900; color: var(--accent); cursor: pointer; }
.nav-logo span { color: var(--accent-hot); }

.sort-game {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 24px 16px; gap: 18px;
}
.game-header { width: 100%; max-width: 840px; display: flex; align-items: center; gap: 14px; }
.back-btn {
  background: var(--surface); border: 2px solid var(--border); border-radius: 24px;
  padding: 8px 16px; font-size: 0.95rem; font-weight: 700; color: var(--fg2);
  cursor: pointer; transition: border-color 0.15s, color 0.15s; white-space: nowrap;
}
.back-btn:hover { border-color: var(--accent); color: var(--accent); }
.progress-row { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
.progress-bar { flex: 1; height: 10px; background: var(--bg3); border-radius: 5px; overflow: hidden; min-width: 0; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-hot)); border-radius: 5px; transition: width 0.4s ease; width: 10%; }
.score-chip {
  background: var(--bg2); border-radius: 24px; padding: 6px 16px; font-size: 1rem;
  font-weight: 700; color: var(--fg2); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.score-chip.big { font-size: 1.1rem; color: var(--accent-hot); background: var(--surface); border: 2px solid var(--border); }
.score-chip.level-chip { color: var(--accent); background: var(--surface); border: 2px solid var(--border); }

/* 限时控制栏 */
.timer-toggle-row {
  width: 100%; max-width: 840px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--surface); border-radius: 16px; padding: 10px 16px;
  border: 2px solid var(--border); box-shadow: 0 2px 8px var(--shadow);
}
.timer-toggle-label { font-size: 0.9rem; font-weight: 700; color: var(--fg2); margin-right: 4px; }
.timer-opt-btn {
  padding: 7px 16px; border-radius: 20px; border: 2px solid var(--border);
  background: var(--surface); font-size: 0.88rem; font-weight: 700;
  color: var(--fg2); cursor: pointer; transition: all 0.15s;
}
.timer-opt-btn:hover { border-color: var(--accent); color: var(--accent); }
.timer-opt-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.sort-timer-wrap { width: 100%; max-width: 840px; display: flex; flex-direction: column; gap: 6px; }
.sort-timer-wrap[hidden] { display: none !important; }
.sort-timer-row { display: flex; align-items: center; gap: 12px; }
#sort-timer-num { font-size: 1.5rem; font-weight: 900; color: var(--accent-hot); font-variant-numeric: tabular-nums; min-width: 44px; }
.sort-timer-bar { flex: 1; height: 12px; background: var(--bg3); border-radius: 6px; overflow: hidden; }
#sort-timer-fill { height: 100%; border-radius: 6px; transition: width 0.9s linear, background-color 0.5s; background: #22c55e; width: 100%; }

/* 原版单词卡片 */
.word-card {
  width: 100%; max-width: 840px; background: var(--surface); border-radius: 24px;
  padding: 28px 32px; text-align: center; box-shadow: 0 6px 28px var(--shadow);
  border: 2px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.word-kanji { font-size: clamp(2.6rem, 5.5vw, 4.2rem); font-weight: 900; color: var(--fg); line-height: 1.15; }
.word-meta-badges { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.meta-badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 14px; border-radius: 20px; font-size: 0.95rem; font-weight: 800; }
.meta-badge.pitch-badge { background: var(--warn-bg); color: var(--warn); border: 1.5px solid rgba(217,119,6,0.35); }
.meta-badge.pos-badge { background: var(--bg2); color: var(--accent); border: 1.5px solid var(--border); }
.word-meaning { font-size: 1.45rem; color: var(--fg2); font-weight: 800; }
.word-hint { font-size: 0.88rem; color: var(--fg3); font-weight: 700; }

/* 填空插槽 */
.answer-zone {
  width: 100%; max-width: 840px; display: flex; justify-content: center;
  gap: 12px; min-height: 80px; align-items: center; flex-wrap: wrap;
}
.slot {
  width: 72px; height: 72px; border-radius: 18px; border: 3px dashed var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.9rem; font-weight: 900; color: var(--fg); background: var(--surface2);
  cursor: pointer; transition: border-color 0.15s, background 0.15s, transform 0.1s;
  user-select: none; position: relative; flex-shrink: 0;
}
.slot.filled { border-style: solid; border-color: var(--accent); background: var(--bg2); box-shadow: 0 2px 10px var(--shadow); }
.slot.correct { border-color: var(--correct); background: var(--correct-bg); color: var(--correct); animation: pop-in 0.35s cubic-bezier(0.175,0.885,0.32,1.4); }
.slot.wrong { border-color: var(--wrong); background: var(--wrong-bg); color: var(--wrong); animation: shake 0.4s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)} }
@keyframes pop-in { 0%{transform:scale(0.6)}70%{transform:scale(1.18)}100%{transform:scale(1)} }
.slot-num { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); font-size: 0.6rem; font-weight: 700; color: var(--fg3); opacity: 0.5; }

/* 原版假名卡片池 */
.kana-pool { width: 100%; max-width: 840px; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
.kana-btn {
  width: 72px; height: 72px; border-radius: 18px; border: 3px solid var(--border);
  background: var(--surface); font-size: 1.8rem; font-weight: 900;
  color: var(--fg); cursor: pointer; transition: all 0.12s;
  user-select: none; box-shadow: 0 3px 10px var(--shadow); flex-shrink: 0;
}
.kana-btn:hover:not(:disabled):not(.used) { border-color: var(--accent); background: var(--bg2); transform: translateY(-3px) scale(1.06); box-shadow: 0 8px 20px var(--shadow); }
.kana-btn:active:not(:disabled):not(.used) { transform: scale(0.95); }
.kana-btn.used { opacity: 0.22; cursor: default; pointer-events: none; }

.sort-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.action-btn {
  padding: 12px 26px; border-radius: 28px; border: none;
  font-size: 1rem; font-weight: 700; cursor: pointer; transition: transform 0.1s, box-shadow 0.15s;
}
.action-btn:active { transform: scale(0.96); }
.btn-secondary { background: var(--surface); color: var(--fg2); border: 2.5px solid var(--border); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.result-message {
  font-size: 1.25rem; font-weight: 700; text-align: center; padding: 16px 24px;
  border-radius: 16px; width: 100%; max-width: 840px;
}
.result-message.success { background: var(--correct-bg); color: var(--correct); }
.result-message.fail { background: var(--wrong-bg); color: var(--wrong); }
</style>
</head>
<body>

  <nav class="top-nav">
    <div class="nav-logo" onclick="location.href='index.html'">かな<span>ゲーム</span></div>
  </nav>

  <div class="sort-game">
    <div class="game-header">
      <button class="back-btn" onclick="location.href='index.html'">← 返回</button>
      <span class="score-chip level-chip">第 <span id="sort-level">1</span> 关</span>
      <div class="progress-row">
        <div class="progress-bar"><div class="progress-fill" id="sort-progress"></div></div>
        <span class="score-chip" id="sort-counter">1/10</span>
      </div>
      <span class="score-chip big" id="sort-score">0分</span>
    </div>

    <div class="timer-toggle-row">
      <span class="timer-toggle-label">⏱ 限时</span>
      <button class="timer-opt-btn active" onclick="setTimerSecs(0, this)">关闭</button>
      <button class="timer-opt-btn" onclick="setTimerSecs(15, this)">15秒</button>
      <button class="timer-opt-btn" onclick="setTimerSecs(30, this)">30秒</button>
      <button class="timer-opt-btn" onclick="setTimerSecs(45, this)">45秒</button>
    </div>

    <div class="sort-timer-wrap" id="sort-timer-wrap" hidden>
      <div class="sort-timer-row">
        <span id="sort-timer-num">15</span>
        <div class="sort-timer-bar"><div id="sort-timer-fill"></div></div>
      </div>
    </div>

    <div class="word-card">
      <div class="word-kanji" id="sort-kanji">测验，测试</div>
      <div class="word-meta-badges">
        <span class="meta-badge pitch-badge" id="sort-pitch">声调: ①</span>
        <span class="meta-badge pos-badge" id="sort-pos">词性: 名词</span>
      </div>
      <div class="word-meaning" id="sort-meaning">测验，测试</div>
      <div class="word-hint" id="sort-hint">共 3 个假名</div>
    </div>

    <div class="answer-zone" id="sort-answer-zone"></div>
    <div class="kana-pool" id="sort-kana-pool"></div>

    <div class="sort-actions">
      <button class="action-btn btn-secondary" onclick="undoLast()">↩ 撤销</button>
      <button class="action-btn btn-secondary" onclick="resetSlots()">🔄 重置</button>
    </div>

    <div class="result-message" id="sort-result" hidden></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zbfjbtzvnhmfzyvooact.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_AP0YnQLgzmB3d63_4zbpjg_vHeTyo8Z';
    const sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    let currentUser = null;
    let score = 0;
    let currentIndex = 0;
    let currentInput = [];
    let timerSecs = 0;
    let timerInterval = null;
    let timeLeft = 0;

    const questions = [
      { kanji: 'テスト', kana: 'テスト', pitch: '①', pos: '名词', meaning: '测验，测试' },
      { kanji: '先生', kana: 'せんせい', pitch: '③', pos: '名词', meaning: '老师' },
      { kanji: '学生', kana: 'がくせい', pitch: '⓪', pos: '名词', meaning: '学生' },
      { kanji: '友達', kana: 'ともだち', pitch: '⓪', pos: '名词', meaning: '朋友' },
      { kanji: '本', kana: 'ほん', pitch: '①', pos: '名词', meaning: '书' },
      { kanji: 'ありがとう', kana: 'ありがとう', pitch: '②', pos: '感叹词', meaning: '谢谢' },
      { kanji: 'おはよう', kana: 'おはよう', pitch: '⓪', pos: '感叹词', meaning: '早上好' },
      { kanji: '挨拶', kana: 'あいさつ', pitch: '①', pos: '名词', meaning: '寒暄，打招呼' },
      { kanji: 'ノート', kana: 'ノート', pitch: '①', pos: '名词', meaning: '笔记本' },
      { kanji: '時計', kana: 'とけい', pitch: '⓪', pos: '名词', meaning: '手表，钟表' }
    ];

    async function initAuth() {
      if (!sbClient) return;
      const { data: { session } } = await sbClient.auth.getSession();
      if (session) currentUser = session.user;
    }

    async function recordMistake(word) {
      let localMistakes = JSON.parse(localStorage.getItem('tangogo_mistakes') || '[]');
      if (!localMistakes.some(m => m.word === word.kana)) {
        localMistakes.push({ word: word.kana, meaning: word.meaning });
        localStorage.setItem('tangogo_mistakes', JSON.stringify(localMistakes));
      }
      if (currentUser && sbClient) {
        try {
          await sbClient.from('user_mistakes').upsert({
            user_id: currentUser.id,
            word: word.kana,
            meaning: word.meaning,
            wrong_count: 1,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id,word' });
        } catch (e) { console.error(e); }
      }
    }

    function setTimerSecs(secs, btn) {
      timerSecs = secs;
      document.querySelectorAll('.timer-opt-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const wrap = document.getElementById('sort-timer-wrap');
      if (secs === 0) {
        wrap.hidden = true;
        clearInterval(timerInterval);
      } else {
        wrap.hidden = false;
        startTimer();
      }
    }

    function startTimer() {
      clearInterval(timerInterval);
      if (timerSecs === 0) return;
      timeLeft = timerSecs;
      updateTimerUI();
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerUI();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeout();
        }
      }, 1000);
    }

    function updateTimerUI() {
      document.getElementById('sort-timer-num').innerText = timeLeft;
      const pct = (timeLeft / timerSecs) * 100;
      const fill = document.getElementById('sort-timer-fill');
      fill.style.width = `${pct}%`;
      fill.style.background = pct > 40 ? '#22c55e' : (pct > 20 ? '#f59e0b' : '#ef4444');
    }

    function handleTimeout() {
      const q = questions[currentIndex];
      const res = document.getElementById('sort-result');
      res.hidden = false;
      res.className = 'result-message fail';
      res.innerText = `⏰ 时间到！正确是: ${q.kana}（已加入错题本）`;
      recordMistake(q);
      setTimeout(() => {
        currentIndex++;
        loadQuestion();
      }, 1500);
    }

    function loadQuestion() {
      if (currentIndex >= questions.length) {
        clearInterval(timerInterval);
        document.getElementById('sort-kanji').innerText = '🎉 挑战完成！';
        document.getElementById('sort-meaning').innerText = `最终得分: ${score} 分`;
        document.getElementById('sort-hint').innerText = '';
        document.getElementById('sort-answer-zone').innerHTML = '';
        document.getElementById('sort-kana-pool').innerHTML = '<button class="action-btn btn-secondary" onclick="location.reload()">再玩一次</button>';
        return;
      }

      const q = questions[currentIndex];
      currentInput = [];
      document.getElementById('sort-result').hidden = true;

      document.getElementById('sort-level').innerText = currentIndex + 1;
      document.getElementById('sort-counter').innerText = `${currentIndex + 1}/${questions.length}`;
      document.getElementById('sort-progress').style.width = `${((currentIndex + 1) / questions.length) * 100}%`;

      document.getElementById('sort-kanji').innerText = q.meaning;
      document.getElementById('sort-pitch').innerText = `声调: ${q.pitch || '⓪'}`;
      document.getElementById('sort-pos').innerText = `词性: ${q.pos || '名'}`;
      document.getElementById('sort-meaning').innerText = q.kanji;
      document.getElementById('sort-hint').innerText = `共 ${q.kana.length} 个假名`;

      // 渲染插槽
      const ansZone = document.getElementById('sort-answer-zone');
      ansZone.innerHTML = '';
      for (let i = 0; i < q.kana.length; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.id = `slot-${i}`;
        slot.innerHTML = `<span class="slot-num">${i + 1}</span><span class="slot-val"></span>`;
        slot.onclick = () => removeSlotLetter(i);
        ansZone.appendChild(slot);
      }

      // 打乱假名生成按钮
      const chars = q.kana.split('').sort(() => Math.random() - 0.5);
      const pool = document.getElementById('sort-kana-pool');
      pool.innerHTML = '';
      chars.forEach((char, idx) => {
        const btn = document.createElement('button');
        btn.className = 'kana-btn';
        btn.id = `kana-btn-${idx}`;
        btn.innerText = char;
        btn.onclick = () => selectLetter(char, idx);
        pool.appendChild(btn);
      });

      startTimer();
    }

    function selectLetter(char, btnIdx) {
      const q = questions[currentIndex];
      if (currentInput.length >= q.kana.length) return;

      currentInput.push({ char, btnIdx });
      document.getElementById(`kana-btn-${btnIdx}`).classList.add('used');
      renderSlots();

      if (currentInput.length === q.kana.length) {
        checkAnswer();
      }
    }

    function removeSlotLetter(slotIdx) {
      if (!currentInput[slotIdx]) return;
      const removed = currentInput.splice(slotIdx, 1)[0];
      document.getElementById(`kana-btn-${removed.btnIdx}`).classList.remove('used');
      renderSlots();
    }

    function undoLast() {
      if (currentInput.length === 0) return;
      const removed = currentInput.pop();
      document.getElementById(`kana-btn-${removed.btnIdx}`).classList.remove('used');
      renderSlots();
    }

    function resetSlots() {
      currentInput.forEach(item => {
        document.getElementById(`kana-btn-${item.btnIdx}`).classList.remove('used');
      });
      currentInput = [];
      renderSlots();
    }

    function renderSlots() {
      const q = questions[currentIndex];
      for (let i = 0; i < q.kana.length; i++) {
        const slot = document.getElementById(`slot-${i}`);
        const valEl = slot.querySelector('.slot-val');
        if (currentInput[i]) {
          valEl.innerText = currentInput[i].char;
          slot.classList.add('filled');
        } else {
          valEl.innerText = '';
          slot.classList.remove('filled');
        }
      }
    }

    function checkAnswer() {
      const q = questions[currentIndex];
      const ans = currentInput.map(item => item.char).join('');
      const res = document.getElementById('sort-result');
      res.hidden = false;

      if (ans === q.kana) {
        clearInterval(timerInterval);
        res.className = 'result-message success';
        res.innerText = '✨ 正确！+10分';
        score += 10;
        document.getElementById('sort-score').innerText = `${score}分`;
        for (let i = 0; i < q.kana.length; i++) {
          document.getElementById(`slot-${i}`).classList.add('correct');
        }
        setTimeout(() => {
          currentIndex++;
          loadQuestion();
        }, 800);
      } else {
        clearInterval(timerInterval);
        res.className = 'result-message fail';
        res.innerText = `❌ 拼错啦，正确是: ${q.kana}（已加入错题本）`;
        for (let i = 0; i < q.kana.length; i++) {
          document.getElementById(`slot-${i}`).classList.add('wrong');
        }
        recordMistake(q);
        setTimeout(() => {
          currentIndex++;
          loadQuestion();
        }, 1500);
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await initAuth();
      loadQuestion();
    });
  </script>
</body>
</html>

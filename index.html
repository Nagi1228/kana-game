<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TangoGo - 日本語単語ゲーム</title>
  <!-- 引入 Supabase 官方 SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --border: #e2e8f0;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    header {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      margin-bottom: 20px;
    }
    .brand { font-size: 22px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9999px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .user-badge:hover { border-color: var(--primary); }
    .avatar-icon { font-size: 18px; }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 680px;
      padding: 24px;
      margin-bottom: 16px;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .tab-btn {
      padding: 8px 16px;
      border: none;
      background: none;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 8px;
    }
    .tab-btn.active { color: var(--primary); background: #eef2ff; }
    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #f1f5f9; color: var(--text); }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .input-group { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .input-group input {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px #c7d2fe; }
    
    /* 游戏主体展示 */
    .word-box { text-align: center; margin: 30px 0; }
    .word-kanji { font-size: 40px; font-weight: 800; margin-bottom: 8px; }
    .word-meaning { font-size: 16px; color: var(--text-muted); }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .option-btn {
      padding: 14px;
      font-size: 16px;
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s;
    }
    .option-btn:hover { border-color: var(--primary); background: #eef2ff; }
    .stats-bar { display: flex; justify-content: space-between; font-size: 14px; color: var(--text-muted); margin-bottom: 12px; }
    
    /* 错词本 */
    .mistake-list { display: flex; flex-direction: column; gap: 8px; }
    .mistake-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }
    
    /* 弹窗 Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-content {
      background: #fff;
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-title { font-size: 18px; font-weight: 700; }
    .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); }
    .avatar-picker { display: flex; gap: 10px; margin: 12px 0 20px 0; }
    .avatar-opt {
      font-size: 24px;
      padding: 8px;
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
    }
    .avatar-opt.selected { border-color: var(--primary); background: #eef2ff; }
  </style>
</head>
<body>

  <header>
    <div class="brand"><span>🎮</span> TangoGo</div>
    <div class="user-badge" id="userBadgeBtn" onclick="openProfileModal()">
      <span class="avatar-icon" id="userAvatar">🌸</span>
      <span id="userNameDisplay">登录 / 注册</span>
    </div>
  </header>

  <main class="card">
    <div class="tabs">
      <button class="tab-btn active" id="tabPractice" onclick="switchView('game')">単語練習</button>
      <button class="tab-btn" id="tabMistakes" onclick="switchView('mistakes')">错词本 (<span id="mistakeCount">0</span>)</button>
    </div>

    <!-- 游戏视图 -->
    <div id="gameView">
      <div class="stats-bar">
        <span>当前关卡: 第 <b id="currentLevel">1</b> 关</span>
        <span>云端状态: <b id="syncStatus" style="color:var(--success)">就绪</b></span>
      </div>
      <div class="word-box">
        <div class="word-kanji" id="wordKanji">食べる</div>
        <div class="word-meaning" id="wordMeaning">吃、用餐</div>
      </div>
      <div class="options-grid" id="optionsContainer"></div>
    </div>

    <!-- 错词本视图 -->
    <div id="mistakesView" style="display:none;">
      <div class="mistake-list" id="mistakeListContainer">
        <p style="color:var(--text-muted); text-align:center; padding: 20px;">暂无错题，继续加油！</p>
      </div>
    </div>
  </main>

  <!-- 个人中心 / 登录 Modal -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="authModalTitle">登录 / 注册</div>
        <button class="close-btn" onclick="closeAuthModal()">&times;</button>
      </div>

      <!-- 未登录面板 -->
      <div id="loginSection">
        <div class="input-group">
          <label>邮箱地址</label>
          <input type="email" id="authEmail" placeholder="your@email.com">
        </div>
        <div class="input-group">
          <label>密码</label>
          <input type="password" id="authPassword" placeholder="至少6位密码">
        </div>
        <div style="display:flex; gap:8px; margin-top:16px;">
          <button class="btn" style="flex:1" onclick="handleSignIn()">登录</button>
          <button class="btn btn-secondary" style="flex:1" onclick="handleSignUp()">注册新账号</button>
        </div>
      </div>

      <!-- 已登录个人中心面板 -->
      <div id="profileSection" style="display:none;">
        <p style="font-size:14px; color:var(--text-muted); margin-bottom:12px;">已登录账号：<b id="profileEmail"></b></p>
        <div class="input-group">
          <label>选择个性头像</label>
          <div class="avatar-picker">
            <span class="avatar-opt" data-avatar="🌸" onclick="selectAvatar('🌸')">🌸</span>
            <span class="avatar-opt" data-avatar="🗻" onclick="selectAvatar('🗻')">🗻</span>
            <span class="avatar-opt" data-avatar="🍣" onclick="selectAvatar('🍣')">🍣</span>
            <span class="avatar-opt" data-avatar="🐱" onclick="selectAvatar('🐱')">🐱</span>
          </div>
        </div>
        <div class="input-group">
          <label>用户昵称</label>
          <input type="text" id="profileNickname" placeholder="自定义昵称">
        </div>
        <div style="display:flex; flex-direction:column; gap:8px; margin-top:16px;">
          <button class="btn" onclick="saveProfile()">保存个人资料</button>
          <button class="btn btn-danger" onclick="handleSignOut()">退出登录</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 初始化 Supabase 客户端配置
    const SUPABASE_URL = 'https://zbfjbtzvnhmfzyvooact.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_AP0YnQLgzmB3d63_4zbpjg_vHeTyo8Z';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 题库预设
    const QUESTION_BANK = [
      { kanji: '食べる', kana: 'たべる', meaning: '吃、用餐', options: ['たべる', 'のむ', 'いく', 'みる'] },
      { kanji: '桜', kana: 'さくら', meaning: '樱花', options: ['さくら', 'うめ', 'もも', 'はな'] },
      { kanji: '友達', kana: 'ともだち', meaning: '朋友', options: ['ともだち', 'かぞく', 'せんせい', 'がくせい'] },
      { kanji: '本', kana: 'ほん', meaning: '书本', options: ['ほん', 'ぺん', 'つくえ', 'かみ'] },
      { kanji: '猫', kana: 'ねこ', meaning: '猫咪', options: ['ねこ', 'いぬ', 'とり', 'さかな'] }
    ];

    let currentUser = null;
    let currentQuestionIdx = 0;
    let mistakes = JSON.parse(localStorage.getItem('tangogo_mistakes') || '[]');
    let userAvatarIcon = localStorage.getItem('tangogo_avatar') || '🌸';
    let currentUnlockedLevel = parseInt(localStorage.getItem('tangogo_level') || '1');

    // 页面启动检查用户登录态
    async function initAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        currentUser = session.user;
        await syncFromCloud();
      }
      updateUserUI();
      renderQuestion();
      renderMistakes();
    }

    // 切换标签视图
    function switchView(view) {
      document.getElementById('gameView').style.display = view === 'game' ? 'block' : 'none';
      document.getElementById('mistakesView').style.display = view === 'mistakes' ? 'block' : 'none';
      document.getElementById('tabPractice').classList.toggle('active', view === 'game');
      document.getElementById('tabMistakes').classList.toggle('active', view === 'mistakes');
    }

    // 渲染题目
    function renderQuestion() {
      const q = QUESTION_BANK[currentQuestionIdx];
      document.getElementById('wordKanji').innerText = q.kanji;
      document.getElementById('wordMeaning').innerText = q.meaning;
      document.getElementById('currentLevel').innerText = currentUnlockedLevel;

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, q);
        container.appendChild(btn);
      });
    }

    // 作答判定
    async function checkAnswer(chosen, q) {
      if (chosen === q.kana) {
        alert('正解！🎉');
        currentQuestionIdx = (currentQuestionIdx + 1) % QUESTION_BANK.length;
        if (currentQuestionIdx === 0) {
          currentUnlockedLevel += 1;
          localStorage.setItem('tangogo_level', currentUnlockedLevel);
          await syncProgressToCloud();
        }
      } else {
        alert(`残念！正确假名是: ${q.kana}`);
        addMistake(q);
      }
      renderQuestion();
    }

    // 错题记录并上报
    async function addMistake(q) {
      if (!mistakes.some(m => m.word === q.kanji)) {
        mistakes.push({ word: q.kanji, kana: q.kana, meaning: q.meaning });
        localStorage.setItem('tangogo_mistakes', JSON.stringify(mistakes));
        renderMistakes();

        if (currentUser) {
          await supabase.from('user_mistakes').upsert({
            user_id: currentUser.id,
            word: q.kanji,
            kana: q.kana,
            meaning: q.meaning,
            last_reviewed: new Date().toISOString()
          }, { onConflict: 'user_id,word' });
        }
      }
    }

    // 渲染错词列表
    function renderMistakes() {
      document.getElementById('mistakeCount').innerText = mistakes.length;
      const listEl = document.getElementById('mistakeListContainer');
      if (mistakes.length === 0) {
        listEl.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding:20px;">暂无错题，继续加油！</p>';
        return;
      }
      listEl.innerHTML = mistakes.map(m => `
        <div class="mistake-item">
          <div>
            <b>${m.word}</b> [${m.kana}]
            <div style="font-size:12px; color:var(--text-muted);">${m.meaning}</div>
          </div>
          <button class="btn btn-secondary" onclick="removeMistake('${m.word}')" style="padding:4px 8px; font-size:12px;">

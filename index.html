<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>かなゲーム - 日语单词闯关</title>
  <!-- 引入 Supabase 官方 SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      --card-bg: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f0f7ff;
      background-image: 
        radial-gradient(#dbeafe 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.8), rgba(240, 247, 255, 0.95));
      background-size: 24px 24px, 100% 100%;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 顶部导航栏 */
    header {
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 32px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo {
      font-size: 24px;
      font-weight: 900;
      background: linear-gradient(135deg, #2563eb, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .nav-btn {
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-sub);
      background: none;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn:hover { color: var(--primary); background: #eff6ff; }
    .nav-btn.active { color: #fff; background: var(--primary); }

    /* 用户登录状态胶囊按钮 */
    .user-capsule {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border: 1px solid var(--border-color);
      border-radius: 9999px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      transition: all 0.2s;
    }
    .user-capsule:hover { border-color: var(--primary); box-shadow: 0 2px 6px rgba(59, 130, 246, 0.15); }
    .user-avatar-tag {
      background: #eff6ff;
      color: var(--primary);
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    /* 主界面容器 */
    .container {
      width: 100%;
      max-width: 820px;
      padding: 32px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 标题区域 */
    .hero-title {
      text-align: center;
      margin-bottom: 28px;
    }
    .hero-icon { font-size: 32px; margin-bottom: 6px; }
    .hero-title h1 {
      font-size: 36px;
      font-weight: 900;
      color: #1e3a8a;
      letter-spacing: -0.5px;
    }
    .hero-title p {
      font-size: 14px;
      color: var(--text-sub);
      margin-top: 6px;
    }

    /* 词库选择卡片 */
    .section-card {
      background: var(--card-bg);
      border-radius: 18px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      padding: 20px 24px;
      width: 100%;
      margin-bottom: 24px;
    }
    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .card-header-row .title {
      font-size: 15px;
      font-weight: 700;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .word-badge {
      background: #eff6ff;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 9999px;
    }
    .selectors-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .select-item label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 4px;
    }
    .select-item select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: #f8fafc;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    /* 游戏模式卡片网格 */
    .modes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
    }
    .mode-card {
      background: var(--card-bg);
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      transition: all 0.2s ease;
    }
    .mode-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
    }
    .mode-card.puzzle { border-color: #bbf7d0; }
    .mode-card.puzzle:hover { background: #f0fdf4; }
    .mode-card.blocks { border-color: #ddd6fe; }
    .mode-card.blocks:hover { background: #f5f3ff; }
    .mode-card.link { border-color: #99f6e4; }
    .mode-card.link:hover { background: #f0fdfa; }
    .mode-card.match { border-color: #fed7aa; }
    .mode-card.match:hover { background: #fff7ed; }

    .mode-icon { font-size: 28px; }
    .mode-info h3 { font-size: 16px; font-weight: 700; color: #1e293b; margin-bottom: 2px; }
    .mode-info p { font-size: 12px; color: var(--text-sub); line-height: 1.4; }

    /* 弹窗通用样式 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-content {
      background: #fff;
      border-radius: 20px;
      padding: 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-title { font-size: 18px; font-weight: 800; color: #1e293b; }
    .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #94a3b8; }
    .input-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 12px; font-weight: 700; color: #475569; }
    .input-group input {
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px #dbeafe; }
    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #f1f5f9; color: #334155; }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger { background: #ef4444; color: #fff; }
    .avatar-list { display: flex; gap: 12px; margin: 10px 0 16px 0; }
    .avatar-btn {
      font-size: 26px;
      padding: 8px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      cursor: pointer;
      background: #fff;
    }
    .avatar-btn.active { border-color: var(--primary); background: #eff6ff; }
  </style>
</head>
<body>

  <!-- 顶部导航栏 -->
  <header>
    <div class="logo" onclick="location.reload()">かなゲーム</div>
    <div class="nav-actions">
      <button class="nav-btn active">首页</button>
      <button class="nav-btn" onclick="alert('词库管理功能持续扩展中！')">词库</button>
      <button class="nav-btn" onclick="openMistakesModal()">错词本 (<span id="mistakeBadge">0</span>)</button>
      
      <!-- 用户状态胶囊按钮 -->
      <div class="user-capsule" onclick="openUserModal()">
        <span class="user-avatar-tag" id="userAvatarIcon">游</span>
        <span id="userDisplayName">游客</span>
      </div>
    </div>
  </header>

  <!-- 游戏大厅内容区 -->
  <div class="container">
    <div class="hero-title">
      <div class="hero-icon">🌸</div>
      <h1>日语单词闯关</h1>
      <p>选择教材与课程，开始挑战 ✨</p>
    </div>

    <!-- 词库选择卡片 -->
    <div class="section-card">
      <div class="card-header-row">
        <div class="title">📖 选择词库</div>
        <div class="word-badge" id="wordTotalBadge">40 词</div>
      </div>
      <div class="selectors-grid">
        <div class="select-item">
          <label>一级：教材系列</label>
          <select id="selBook"><option>人教版初中日语（新）</option></select>
        </div>
        <div class="select-item">
          <label>二级：年级 / 分册</label>
          <select id="selGrade"><option>七年级</option></select>
        </div>
        <div class="select-item">
          <label>三级：章节 / 课时</label>
          <select id="selLesson"><option>入门单元 第1课</option></select>
        </div>
      </div>
    </div>

    <!-- 游戏玩法模式选择卡片 -->
    <div class="modes-grid">
      <div class="mode-card puzzle" onclick="startGame('拼图模式')">
        <div class="mode-icon">🧩</div>
        <div class="mode-info">
          <h3>拼图模式</h3>
          <p>点击假名按钮<br>依次填入空格拼出单词</p>
        </div>
      </div>

      <div class="mode-card blocks" onclick="startGame('方块模式')">
        <div class="mode-icon">🎮</div>
        <div class="mode-info">
          <h3>方块模式</h3>
          <p>假名从天而降<br>移动到正确位置接住它！</p>
        </div>
      </div>

      <div class="mode-card link" onclick="startGame('连连看模式')">
        <div class="mode-icon">🔗</div>
        <div class="mode-info">
          <h3>连连看模式</h3>
          <p>左右配对连线<br>把单词和释义连起来</p>
        </div>
      </div>

      <div class="mode-card match" onclick="startGame('消消乐模式')">
        <div class="mode-icon">🍬</div>
        <div class="mode-info">
          <h3>消消乐模式</h3>
          <p>12 张卡片两两配对<br>点对了就一起消失</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 登录 / 注册 / 个人中心 弹窗 -->
  <div class="modal-overlay" id="userModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">用户登录 / 注册</div>
        <button class="close-btn" onclick="closeUserModal()">&times;</button>
      </div>

      <!-- 未登录表单 -->
      <div id="unauthPanel">
        <div class="input-group">
          <label>邮箱地址</label>
          <input type="email" id="inputEmail" placeholder="your@email.com">
        </div>
        <div class="input-group">
          <label>密码</label>
          <input type="password" id="inputPwd" placeholder="不少于6位密码">
        </div>
        <div style="display:flex; gap:10px; margin-top:20px;">
          <button class="btn" style="flex:1;" onclick="doSignIn()">登录</button>
          <button class="btn btn-secondary" style="flex:1;" onclick="doSignUp()">注册新账号</button>
        </div>
      </div>

      <!-- 已登录个人中心 -->
      <div id="profilePanel" style="display:none;">
        <p style="font-size:13px; color:var(--text-sub); margin-bottom:12px;">已绑定账号：<b id="profileEmailTxt"></b></p>
        <div class="input-group">
          <label>挑选个人专属头像</label>
          <div class="avatar-list">
            <span class="avatar-btn" data-av="🌸" onclick="chooseAvatar('🌸')">🌸</span>
            <span class="avatar-btn" data-av="🗻" onclick="chooseAvatar('🗻')">🗻</span>
            <span class="avatar-btn" data-av="🍣" onclick="chooseAvatar('🍣')">🍣</span>
            <span class="avatar-btn" data-av="🐱" onclick="chooseAvatar('🐱')">🐱</span>
          </div>
        </div>
        <div class="input-group">
          <label>个性昵称</label>
          <input type="text" id="inputNickname" placeholder="输入昵称">
        </div>
        <div style="display:flex; flex-direction:column; gap:10px; margin-top:20px;">
          <button class="btn" onclick="saveUserProfile()">保存修改</button>
          <button class="btn btn-danger" onclick="doSignOut()">退出登录</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Supabase 连接配置
    const SUPABASE_URL = 'https://zbfjbtzvnhmfzyvooact.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_AP0YnQLgzmB3d63_4zbpjg_vHeTyo8Z';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let selectedAvatar = localStorage.getItem('tangogo_avatar') || '🌸';
    let mistakesList = JSON.parse(localStorage.getItem('tangogo_mistakes') || '[]');

    // 初始化检查会话
    async function initApp() {
      updateMistakeBadge();
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        currentUser = session.user;
        await syncDataFromCloud();
      }
      refreshHeaderUI();
    }

    // 弹窗控制
    function openUserModal() {
      const modal = document.getElementById('userModal');
      const unauth = document.getElementById('unauthPanel');
      const profile = document.getElementById('profilePanel');
      if (currentUser) {
        document.getElementById('modalTitle').innerText = '个人中心';
        unauth.style.display = 'none';
        profile.style.display = 'block';
        document.getElementById('profileEmailTxt').innerText = currentUser.email;
        chooseAvatar(selectedAvatar);
      } else {
        document.getElementById('modalTitle').innerText = '用户登录 / 注册';
        unauth.style.display = 'block';
        profile.style.display = 'none';
      }
      modal.classList.add('open');
    }
    function closeUserModal() {
      document.getElementById('userModal').classList.remove('open');
    }

    // 更新顶部栏头像昵称
    function refreshHeaderUI() {
      const iconEl = document.getElementById('userAvatarIcon');
      const nameEl = document.getElementById('userDisplayName');
      if (currentUser) {

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かなゲーム · Tangogo — 日语单词闯关</title>
<meta name="color-scheme" content="light dark">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // 首屏渲染前快速确定主题，杜绝白屏/黑屏闪烁
  (function () {
    var t = null;
    try { t = localStorage.getItem('kana-theme'); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  /* ============ 设计令牌规范：单一强调色体系与自适应深浅色 ============ */
  :root {
    --bg: #FAF9F6;
    --surface: #FFFFFF;
    --field: #F3F2EE;
    --ink: #16161A;
    --muted: #6C6C78;
    --line: #E8E6E1;
    --accent: #3B4CCA;
    --accent-soft: #EEF0FC;
    --accent-line: rgba(59, 76, 202, .32);
    --on-accent: #FFFFFF;
    --glow: rgba(59, 76, 202, .08);
    --glass: rgba(250, 249, 246, .82);
    --shadow: 0 1px 2px rgba(20, 20, 40, .04), 0 12px 32px -16px rgba(20, 20, 40, .12);
    --shadow-hover: 0 2px 4px rgba(20, 20, 40, .05), 0 20px 40px -18px rgba(59, 76, 202, .28);
    --ring: 0 0 0 4px rgba(59, 76, 202, .16);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB",
            "Noto Sans SC", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #0E0E11;
    --surface: #17171C;
    --field: #1F1F26;
    --ink: #F2F2F4;
    --muted: #9B9BA8;
    --line: #272730;
    --accent: #8E9AFF;
    --accent-soft: #1E2140;
    --accent-line: rgba(142, 154, 255, .42);
    --on-accent: #0E0E11;
    --glow: rgba(142, 154, 255, .12);
    --glass: rgba(14, 14, 17, .82);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px -16px rgba(0, 0, 0, .6);
    --shadow-hover: 0 2px 4px rgba(0, 0, 0, .4), 0 20px 40px -18px rgba(142, 154, 255, .3);
    --ring: 0 0 0 4px rgba(142, 154, 255, .22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    overflow-x: hidden;
    min-height: 100vh;
    transition: background .3s ease, color .3s ease;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto 0; height: 500px; pointer-events: none; z-index: 0;
    background: radial-gradient(60% 100% at 50% 0%, var(--glow), transparent 70%);
  }
  a { color: inherit; text-decoration: none; }
  button, select, input { font: inherit; color: inherit; }
  svg { display: block; }
  .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 12px; }

  /* ============ 顶部导航栏 ============ */
  .header {
    position: sticky; top: 0; z-index: 50;
    background: var(--glass);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    border-bottom: 1px solid transparent;
    transition: border-color .25s ease;
  }
  .header.scrolled { border-bottom-color: var(--line); }
  .header-inner {
    max-width: 1040px; margin: 0 auto; padding: 0 24px; height: 64px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .logo { font-size: 21px; font-weight: 800; letter-spacing: -.02em; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .logo span { color: var(--accent); }
  
  .nav { display: flex; align-items: center; gap: 4px; }
  .nav a, .nav button.nav-link {
    display: inline-flex; align-items: center; gap: 8px; border: none;
    padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted);
    background: transparent; cursor: pointer; transition: color .15s ease, background .15s ease;
  }
  .nav a:hover, .nav button.nav-link:hover { color: var(--ink); }
  .nav a.active { color: var(--ink); background: var(--field); font-weight: 600; }
  
  .badge {
    min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px;
    background: var(--accent); color: var(--on-accent);
    font-size: 11px; font-weight: 700; line-height: 19px; text-align: center; font-variant-numeric: tabular-nums;
  }
  
  .actions { display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: transparent;
    display: grid; place-items: center; cursor: pointer; color: var(--muted);
    transition: color .15s, border-color .15s, background .15s;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--muted); }
  .sun { display: none; }
  :root[data-theme="dark"] .sun { display: block; }
  :root[data-theme="dark"] .moon { display: none; }
  
  .user-capsule {
    height: 38px; padding: 3px 14px 3px 4px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); display: inline-flex; align-items: center; gap: 8px;
    font-size: 13.5px; font-weight: 600; cursor: pointer; transition: border-color .15s, transform .15s;
  }
  .user-capsule:hover { border-color: var(--muted); transform: translateY(-1px); }
  .avatar-glyph {
    width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700;
  }

  /* ============ 主舞台布局 ============ */
  main { position: relative; z-index: 1; overflow-x: clip; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 24px 64px; position: relative; }

  /* ============ Hero 区 ============ */
  .hero { text-align: center; padding: 64px 0 8px; position: relative; }
  .kana-watermark {
    position: absolute; top: -16px; right: -100px; font-size: 420px; font-weight: 800; line-height: 1;
    color: var(--accent); opacity: .04; pointer-events: none; user-select: none; z-index: -1;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12.5px; letter-spacing: .12em; color: var(--muted); font-weight: 600;
  }
  .eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  h1 {
    margin: 18px 0 14px; font-size: clamp(38px, 7vw, 60px); line-height: 1.1;
    font-weight: 800; letter-spacing: -.03em;
  }
  h1 em { font-style: normal; color: var(--accent); }
  .hero p { font-size: 16.5px; color: var(--muted); }

  /* ============ 词库控制面板 ============ */
  .panel {
    margin-top: 40px; padding: 26px 28px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .panel-title { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
  .panel-title .icon { color: var(--accent); }
  .link-more {
    display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500;
    cursor: pointer; background: none; border: none; padding: 0; transition: color .15s;
  }
  .link-more .icon { width: 15px; height: 15px; transition: transform .2s ease; }
  .link-more:hover { color: var(--accent); }
  .link-more:hover .icon { transform: translateX(3px); }

  .fields { display: grid; grid-template-columns: 1.25fr 1fr 1.35fr; gap: 14px; }
  .field label { display: block; margin-bottom: 8px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  .select-wrap { position: relative; }
  .select-wrap select {
    width: 100%; height: 46px; padding: 0 38px 0 14px; border-radius: 12px;
    border: 1px solid transparent; background: var(--field);
    font-size: 14.5px; font-weight: 600; appearance: none; -webkit-appearance: none; cursor: pointer;
    transition: border-color .15s, box-shadow .15s, background .15s;
    text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
  }
  .select-wrap select:hover { border-color: var(--line); }
  .select-wrap select:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); background: var(--surface); }
  .select-wrap .icon {
    position: absolute; right: 14px; top: 50%; width: 16px; height: 16px; margin-top: -8px;
    color: var(--muted); pointer-events: none;
  }

  .stats-bar {
    margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
  }
  .stat-col + .stat-col { padding-left: 20px; border-left: 1px solid var(--line); }
  .stat-col b {
    display: block; font-size: 28px; font-weight: 700; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; line-height: 1.15;
  }
  .stat-col b small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 4px; }
  .stat-col span { font-size: 12.5px; color: var(--muted); }
  .stat-col a { color: var(--accent); font-weight: 600; margin-left: 8px; cursor: pointer; }
  .stat-col a:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* ============ 游戏玩法矩阵 ============ */
  .section-label {
    display: flex; align-items: center; gap: 16px; margin: 52px 0 18px;
    font-size: 13px; letter-spacing: .12em; color: var(--muted); font-weight: 600;
  }
  .section-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .modes-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .mode-card {
    display: flex; flex-direction: column; min-height: 184px; padding: 22px 24px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
    cursor: pointer; user-select: none;
    transition: transform .25s cubic-bezier(.2, .7, .2, 1), border-color .2s, box-shadow .25s;
  }
  .mode-card:hover { transform: translateY(-3px); border-color: var(--accent-line); box-shadow: var(--shadow-hover); }
  .mode-card:active { transform: translateY(-1px); }
  .mode-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .mode-icon {
    width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); transition: background .25s, color .25s;
  }
  .mode-icon .icon { width: 22px; height: 22px; }
  .mode-card:hover .mode-icon { background: var(--accent); color: var(--on-accent); }
  .mode-no { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .06em; opacity: .7; }
  .mode-card h3 { margin-top: 22px; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .mode-card p { margin-top: 5px; font-size: 13.5px; color: var(--muted); }
  .mode-foot { margin-top: auto; padding-top: 18px; display: flex; align-items: center; justify-content: space-between; }
  .tag { padding: 3px 10px; border-radius: 999px; background: var(--field); color: var(--muted); font-size: 11.5px; font-weight: 600; }
  .mode-foot .icon { color: var(--muted); transition: transform .25s ease, color .2s; }
  .mode-card:hover .mode-foot .icon { transform: translateX(4px); color: var(--accent); }

  .footer { padding: 56px 0 40px; text-align: center; font-size: 12.5px; color: var(--muted); }

  /* ============ 模态弹窗 (无原生 alert) ============ */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(14, 14, 17, .55);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-dialog {
    width: 100%; max-width: 400px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
    padding: 26px; position: relative; animation: modalPop .24s cubic-bezier(.16, 1, .3, 1);
  }
  @keyframes modalPop {
    from { opacity: 0; transform: scale(.96) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .modal-title { font-size: 18px; font-weight: 700; }
  .close-icon-btn {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line);
    background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--muted);
  }
  .close-icon-btn:hover { color: var(--ink); border-color: var(--muted); }
  
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .form-input {
    width: 100%; height: 42px; padding: 0 13px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--field);
    font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .form-input:focus { border-color: var(--accent); box-shadow: var(--ring); background: var(--surface); }
  
  .avatar-row { display: flex; gap: 8px; margin: 4px 0 12px; }
  .avatar-pick-btn {
    width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--field); font-size: 14px; font-weight: 700; cursor: pointer;
    display: grid; place-items: center; transition: border-color .15s, background .15s;
  }
  .avatar-pick-btn.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  
  .action-btn-group { display: flex; gap: 10px; margin-top: 20px; }
  .btn-primary {
    flex: 1; height: 42px; border-radius: 10px; border: none;
    background: var(--accent); color: var(--on-accent); font-size: 14px; font-weight: 600; cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .btn-primary:hover { opacity: .92; }
  .btn-primary:active { transform: translateY(1px); }
  .btn-secondary {
    flex: 1; height: 42px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--field); color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background .15s;
  }
  .btn-secondary:hover { background: var(--line); }
  .btn-danger {
    width: 100%; height: 40px; border-radius: 10px; border: 1px solid rgba(239, 68, 68, .2);
    background: transparent; color: #EF4444; font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  .btn-danger:hover { background: rgba(239, 68, 68, .06); }

  /* ============ 浮动 Toast 消息 ============ */
  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
    padding: 10px 20px; border-radius: 999px; background: var(--ink); color: var(--bg);
    font-size: 13.5px; font-weight: 500; white-space: nowrap; max-width: calc(100vw - 32px);
    overflow: hidden; text-overflow: ellipsis; z-index: 200;
    transition: opacity .25s ease, transform .25s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ============ 入场动画与性能优化 ============ */
  .reveal { opacity: 0; transform: translateY(12px); animation: rise .6s cubic-bezier(.2, .7, .2, 1) forwards; animation-delay: calc(var(--i, 0) * 60ms); }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .reveal { animation: none; opacity: 1; transform: none; }
    * { transition-duration: .01ms !important; }
  }

  /* ============ 移动端导航与响应式断点 ============ */
  .tabbar { display: none; }
  @media (max-width: 720px) {
    .nav { display: none; }
    .user-capsule .name-label { display: none; }
    .user-capsule { padding: 3px; }
    .header-inner { padding: 0 18px; height: 58px; }
    .wrap { padding: 0 18px 48px; }
    .hero { padding-top: 40px; }
    .kana-watermark { font-size: 260px; right: -50px; }
    .panel { padding: 20px; margin-top: 28px; border-radius: 18px; }
    .fields { grid-template-columns: 1fr; gap: 12px; }
    .stat-col b { font-size: 24px; }
    .stat-col + .stat-col { padding-left: 14px; }
    .section-label { margin-top: 40px; }
    body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
    .tabbar {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
      background: var(--glass); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
      border-top: 1px solid var(--line);
    }
    .tabbar button, .tabbar a {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0;
      background: none; border: none; font-size: 11px; font-weight: 500; color: var(--muted);
      position: relative; cursor: pointer;
    }
    .tabbar button.active, .tabbar a.active { color: var(--accent); font-weight: 600; }
    .tabbar .badge { position: absolute; top: 0; left: calc(50% + 6px); min-width: 17px; height: 17px; line-height: 17px; font-size: 10px; padding: 0 4px; }
    .toast { bottom: calc(80px + env(safe-area-inset-bottom)); }
  }
  @media (max-width: 560px) {
    .modes-grid { grid-template-columns: 1fr; gap: 12px; }
    .mode-card { min-height: 0; padding: 20px; }
    .mode-card h3 { margin-top: 18px; }
  }
</style>
</head>
<body>

<!-- 顶部导航栏 -->
<header class="header" id="header">
  <div class="header-inner">
    <div class="logo" onclick="location.reload()">かな<span>ゲーム</span></div>

    <nav class="nav" aria-label="主导航">
      <a href="#" class="active">首页</a>
      <a href="vocab.html" id="vocabNavBtn">词库</a>
      <button class="nav-link" onclick="openMistakesModal()">
        错词本 <span class="badge" id="navMistakeBadge">0</span>
      </button>
    </nav>

    <div class="actions">
      <!-- 极简深色模式切换按钮 -->
      <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深浅主题">
        <svg class="icon moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="icon sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>

      <!-- 账号胶囊 -->
      <button class="user-capsule" type="button" onclick="openUserModal()" aria-label="用户账号">
        <span class="avatar-glyph" id="userAvatarGlyph">桜</span>
        <span class="name-label" id="userDisplayName">登录 / 注册</span>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <!-- 极简 Hero 区域 -->
    <section class="hero">
      <div class="kana-watermark" aria-hidden="true">あ</div>
      <div class="eyebrow reveal" style="--i:0"><i></i>日语单词 · 游戏化记忆</div>
      <h1 class="reveal" style="--i:1">日语单词<em>闯关</em></h1>
      <p class="reveal" style="--i:2">选择课程词库，挑一种玩法开启专注训练。</p>
    </section>

    <!-- 词库联动控制面板 -->
    <section class="panel reveal" style="--i:3" aria-labelledby="libTitle">
      <div class="panel-head">
        <div class="panel-title" id="libTitle">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5"/></svg>
          选择词库
        </div>
        <button class="link-more" onclick="showToast('已自动载入最新课程版本')">
          <span>当前教材库</span>
          <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>

      <!-- 三级级联下拉框 -->
      <div class="fields">
        <div class="field">
          <label for="bookSelect">教材系列</label>
          <div class="select-wrap">
            <select id="bookSelect" onchange="onBookChange()"></select>
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <div class="field">
          <label for="gradeSelect">年级 / 分册</label>
          <div class="select-wrap">
            <select id="gradeSelect" onchange="onGradeChange()"></select>
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <div class="field">
          <label for="lessonSelect">章节 / 课时</label>
          <div class="select-wrap">
            <select id="lessonSelect" onchange="onLessonSelectChange()"></select>
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
      </div>

      <!-- 数据统计区（支持动态缓动跳字） -->
      <div class="stats-bar">
        <div class="stat-col"><b id="statLesson">0</b><span>本课词数</span></div>

<!-- 登录 / 注册 / 个人设置 浮层弹窗 -->
<div class="modal-overlay" id="userModal">

      <button class="close-icon-btn" onclick="closeUserModal()">
        <svg viewBox="0 0 24 24" class="icon" style="width:16px; height:16px;"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>

    <!-- 未登录状态视图 -->
    <div id="unauthPanel">

    <!-- 已登录设置视图 -->

      <div class="form-group">

          <button class="avatar-pick-btn" data-av="桜" onclick="chooseAvatar('桜')">桜</button>
          <button class="avatar-pick-btn" data-av="藤" onclick="chooseAvatar('藤')">藤</button>

<!-- 浮动通知消息 -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  /* ============ Supabase 初始化 ============ */
  const SUPABASE_URL = 'https://zbfjbtzvnhmfzyvooact.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_AP0YnQLgzmB3d63_4zbpjg_vHeTyo8Z';
  const sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

  let currentUser = null;
  let selectedAvatar = localStorage.getItem('tangogo_avatar') || '桜';
  let currentNickname = localStorage.getItem('tangogo_nickname') || '';
  let mistakesList = JSON.parse(localStorage.getItem('tangogo_mistakes') || '[]');

  /* 提示框替代原生 alert */
  let toastTimer = null;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 2400);
  }

  /* 数字渐变缓动动画 */
  function tweenNumber(el, targetNum) {
    const from = parseInt(el.textContent, 10) || 0;
    if (from === targetNum || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      el.textContent = targetNum;
      return;
    }
    const t0 = performance.now();
    const duration = 400;
    function frame(t) {
      const p = Math.min((t - t0) / duration, 1);
      const ease = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(from + (targetNum - from) * ease);
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* ============ 教材数据结构配置 ============ */
  function makeLessons(prefix, count, startNo = 1) {
    return Array.from({ length: count }, (_, i) => ({
      id: `${prefix}_l${i + 1}`,
      name: `第${startNo + i}课`
    }));
  }

  const CURRICULUM = [
    {
      id: 'std_beg', name: '新版标准日本语初级',
      children: [
        { id: 'std_beg_1', name: '初级上册', lessons: makeLessons('std_beg_1', 24) },
        { id: 'std_beg_2', name: '初级下册', lessons: makeLessons('std_beg_2', 24, 25) }
      ]
    },
    {
      id: 'pep_jr', name: '人教版初中日语（新）',
      children: [
        {
          id: 'pep_jr_7', name: '七年级',
          lessons: [
            { id: 'pep_jr_7_intro1', name: '入门单元 第1课' },
            { id: 'pep_jr_7_intro2', name: '入门单元 第2课' },
            { id: 'pep_jr_7_intro3', name: '入门单元 第3课' },
            ...makeLessons('pep_jr_7', 12)
          ]
        },
        { id: 'pep_jr_8', name: '八年级', lessons: makeLessons('pep_jr_8', 12) },
        { id: 'pep_jr_9', name: '九年级', lessons: makeLessons('pep_jr_9', 12) }
      ]
    },
    {
      id: 'pep_sr', name: '人教版高中日语',
      children: [
        { id: 'pep_sr_b1', name: '必修一', lessons: makeLessons('pep_sr_b1', 4) },
        { id: 'pep_sr_b2', name: '必修二', lessons: makeLessons('pep_sr_b2', 4, 5) },
        { id: 'pep_sr_b3', name: '必修三', lessons: makeLessons('pep_sr_b3', 4, 9) }
      ]
    }
  ];

  /* 验证管理员写入权限 */
  async function checkAdminPermission() {
    // 词库按钮已设为默认展示（与 tangogo-home-redesign.html 一致）
    if (!currentUser || !sbClient) return false;
    try {
      const { data, error } = await sbClient.from('words').insert([{
        book_id: '_auth_probe_',
        grade_id: '_auth_probe_',
        lesson_id: '_auth_probe_',
        kana: 'probe',
        meaning: 'probe'
      }]).select('id');

      if (!error && data && data.length > 0) {
        await sbClient.from('words').delete().eq('id', data[0].id);
        return true;
      }
      return false;
    } catch (e) {
      return false;
    }
  }

  /* 初始化教材选择器 */
  function initCurriculumUI() {
    const bSel = document.getElementById('bookSelect');
    bSel.innerHTML = '';
    CURRICULUM.forEach(b => {
      bSel.innerHTML += `<option value="${b.id}">${b.name}</option>`;
    });

    const savedBook = localStorage.getItem('tangogo_pref_book');
    if (savedBook && CURRICULUM.some(b => b.id === savedBook)) {
      bSel.value = savedBook;
    }
    onBookChange(true);
  }

  function onBookChange(isInitial = false) {
    const bId = document.getElementById('bookSelect').value;
    localStorage.setItem('tangogo_pref_book', bId);
    const book = CURRICULUM.find(b => b.id === bId);
    const gSel = document.getElementById('gradeSelect');
    gSel.innerHTML = '';
    if (book) {
      book.children.forEach(g => {
        gSel.innerHTML += `<option value="${g.id}">${g.name}</option>`;
      });
    }

    if (isInitial) {
      const savedGrade = localStorage.getItem('tangogo_pref_grade');
      if (savedGrade && book && book.children.some(g => g.id === savedGrade)) {
        gSel.value = savedGrade;
      }
    }
    onGradeChange(isInitial);
  }

  async function onGradeChange(isInitial = false) {
    const bId = document.getElementById('bookSelect').value;
    const gId = document.getElementById('gradeSelect').value;
    localStorage.setItem('tangogo_pref_grade', gId);

    const book = CURRICULUM.find(b => b.id === bId);
    const grade = book ? book.children.find(g => g.id === gId) : null;
    const lSel = document.getElementById('lessonSelect');
    lSel.innerHTML = '';

    if (!grade) return;

    let countsMap = {};
    let totalGradeWords = 0;

    if (sbClient) {
      try {
        const { data, error } = await sbClient
          .from('words')
          .select('lesson_id')
          .eq('book_id', bId)
          .eq('grade_id', gId);

        if (!error && data) {
          totalGradeWords = data.length;
          data.forEach(row => {
            countsMap[row.lesson_id] = (countsMap[row.lesson_id] || 0) + 1;
          });
        }
      } catch (e) {
        console.warn('统计词数异常:', e);
      }
    }

    tweenNumber(document.getElementById('statTotal'), totalGradeWords);

    grade.lessons.forEach(l => {
      const count = countsMap[l.id] || 0;
      lSel.innerHTML += `<option value="${l.id}" data-count="${count}">${l.name} (${count}词)</option>`;
    });

    if (isInitial) {
      const savedLesson = localStorage.getItem('tangogo_pref_lesson');
      if (savedLesson && grade.lessons.some(l => l.id === savedLesson)) {
        lSel.value = savedLesson;
      }
    }

    onLessonSelectChange();
  }

  function onLessonSelectChange() {
    const lSel = document.getElementById('lessonSelect');
    const lId = lSel.value;
    localStorage.setItem('tangogo_pref_lesson', lId);

    const opt = lSel.options[lSel.selectedIndex];
    const count = opt ? parseInt(opt.getAttribute('data-count') || '0', 10) : 0;
    tweenNumber(document.getElementById('statLesson'), count);
  }

  /* 启动具体玩法 */
  function startGame(modeName) {
    const routes = {
      '拼图模式': 'puzzle.html',
      '方块模式': 'blocks.html',
      '连连看模式': 'link.html',
      '消消乐模式': 'match.html'
    };

    const target = routes[modeName];
    if (!target) return;

    const book = document.getElementById('bookSelect').value;
    const grade = document.getElementById('gradeSelect').value;
    const lesson = document.getElementById('lessonSelect').value;

    window.location.href = `${target}?book=${encodeURIComponent(book)}&grade=${encodeURIComponent(grade)}&lesson=${encodeURIComponent(lesson)}`;
  }

  /* 账号弹窗交互 */
  function openUserModal() {
    const modal = document.getElementById('userModal');
    const unauth = document.getElementById('unauthPanel');
    const profile = document.getElementById('profilePanel');
    if (currentUser) {
      document.getElementById('modalTitle').innerText = '个人设置';
      unauth.style.display = 'none';
      profile.style.display = 'block';
      document.getElementById('profileEmailTxt').innerText = currentUser.email;
      document.getElementById('inputNickname').value = currentNickname || currentUser.email.split('@')[0];
      chooseAvatar(selectedAvatar);
    } else {
      document.getElementById('modalTitle').innerText = '用户登录 / 注册';
      unauth.style.display = 'block';
      profile.style.display = 'none';
    }
    modal.style.display = 'flex';
  }

  function closeUserModal() {
    document.getElementById('userModal').style.display = 'none';
  }

  function chooseAvatar(av) {
    selectedAvatar = av;
    document.querySelectorAll('.avatar-pick-btn').forEach(btn => {
      btn.classList.toggle('selected', btn.getAttribute('data-av') === av);
    });
  }

  async function refreshHeaderUI() {
    const avatarEl = document.getElementById('userAvatarGlyph');
    const nameEl = document.getElementById('userDisplayName');
    if (currentUser) {
      avatarEl.innerText = selectedAvatar;
      nameEl.innerText = currentNickname || currentUser.email.split('@')[0];
    } else {
      avatarEl.innerText = '桜';
      nameEl.innerText = '登录 / 注册';
    }
    await checkAdminPermission();
  }

  async function doSignUp() {
    const email = document.getElementById('inputEmail').value.trim();
    const password = document.getElementById('inputPwd').value;
    if (!email || !password) return showToast('请填写邮箱和密码');
    if (!sbClient) return showToast('数据库连接中，请稍后再试');
    const { data, error } = await sbClient.auth.signUp({ email, password });
    if (error) return showToast('注册失败: ' + error.message);
    currentUser = data.user;
    closeUserModal();
    await refreshHeaderUI();
    showToast('注册成功！已为您登录');
  }

  async function doSignIn() {
    const email = document.getElementById('inputEmail').value.trim();
    const password = document.getElementById('inputPwd').value;
    if (!email || !password) return showToast('请填写邮箱和密码');
    if (!sbClient) return showToast('数据库连接中，请稍后再试');
    const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
    if (error) return showToast('登录失败: ' + error.message);
    currentUser = data.user;
    closeUserModal();
    await refreshHeaderUI();
    showToast('登录成功，欢迎回来！');
  }

  async function doSignOut() {
    if (sbClient) await sbClient.auth.signOut();
    currentUser = null;
    currentNickname = '';
    localStorage.removeItem('tangogo_nickname');
    closeUserModal();
    await refreshHeaderUI();
    showToast('已安全退出登录');
  }

  async function saveUserProfile() {
    const nicknameInput = document.getElementById('inputNickname').value.trim();
    currentNickname = nicknameInput || (currentUser ? currentUser.email.split('@')[0] : '');
    localStorage.setItem('tangogo_avatar', selectedAvatar);
    localStorage.setItem('tangogo_nickname', currentNickname);

    if (currentUser && sbClient) {
      await sbClient.from('profiles').upsert({
        id: currentUser.id,
        avatar_id: selectedAvatar,
        username: currentNickname,
        updated_at: new Date().toISOString()
      });
    }
    await refreshHeaderUI();
    closeUserModal();
    showToast('个人设置已保存');
  }

  function openMistakesModal() {
    if (mistakesList.length === 0) {
      showToast('当前错词本为空，继续保持！');
    } else {
      showToast(`当前错词记录共有 ${mistakesList.length} 个单词，即将开启错词训练。`);
    }
  }

  /* 页面挂载与事件绑定 */
  window.addEventListener('DOMContentLoaded', async () => {
    initCurriculumUI();

    // 更新错词徽标与统计数
    const wrongLen = mistakesList.length;
    document.getElementById('navMistakeBadge').innerText = wrongLen;
    document.getElementById('tabMistakeBadge').innerText = wrongLen;
    document.getElementById('statWrong').innerText = wrongLen;
    if (wrongLen === 0) {
      document.getElementById('navMistakeBadge').style.display = 'none';
      document.getElementById('tabMistakeBadge').style.display = 'none';
    }

    // 初始化深浅主题切换按钮
    const themeBtn = document.getElementById('themeBtn');
    themeBtn.addEventListener('click', () => {
      const root = document.documentElement;
      const nextTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', nextTheme);
      try { localStorage.setItem('kana-theme', nextTheme); } catch (e) {}
    });

    // 顶部导航滚动边框响应
    const header = document.getElementById('header');
    window.addEventListener('scroll', () => {
      header.classList.toggle('scrolled', window.scrollY > 4);
    }, { passive: true });

    // 模态弹窗点击背景关闭
    window.addEventListener('click', (e) => {
      const modal = document.getElementById('userModal');
      if (e.target === modal) closeUserModal();
    });

    // Supabase 会话持久化初始化
    if (sbClient) {
      const { data: { session } } = await sbClient.auth.getSession();
      if (session) currentUser = session.user;
    }
    await refreshHeaderUI();
  });
</script>

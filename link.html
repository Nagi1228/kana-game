<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かなゲーム - 连连看模式</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=M+PLUS+Rounded+1c:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&display=swap">
<style>
:root {
  --bg: #f0f7ff;
  --bg2: #dbeafe;
  --bg3: #bfdbfe;
  --surface: #ffffff;
  --surface2: #f8faff;
  --border: #93c5fd;
  --fg: #0c2340;
  --fg2: #1e4d8c;
  --fg3: #2563eb;
  --accent: #2563eb;
  --accent-hot: #f97316;
  --correct: #059669;
  --correct-bg: #d1fae5;
  --wrong: #e11d48;
  --wrong-bg: #ffe4e6;
  --shadow: rgba(37,99,235,0.18);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh; font-family: 'Noto Sans SC', sans-serif;
  background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
  color: var(--fg); overflow-x: hidden; display: flex; flex-direction: column; user-select: none;
}
.jp-text { font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif; }
.cn-text { font-family: 'Noto Sans SC', sans-serif; }
[hidden] { display: none !important; }

.top-nav {
  display: flex; align-items: center; gap: 10px; padding: 12px 24px;
  background-color: var(--surface); border-bottom: 2px solid var(--border);
  box-shadow: 0 2px 12px var(--shadow); position: sticky; top: 0; z-index: 50;
}
.nav-logo { font-size: 1.6rem; font-weight: 900; color: var(--accent); cursor: pointer; }
.nav-logo span { color: var(--accent-hot); }

.match-game {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 22px 16px; gap: 16px; justify-content: center;
}

.match-top-card {
  width: 100%; max-width: 1180px; background: var(--surface); border: 2.5px solid var(--border);
  border-radius: 20px; padding: 12px 20px; display: flex; align-items: center; gap: 14px;
  box-shadow: 0 4px 16px var(--shadow); flex-wrap: wrap;
}
.back-btn {
  background: var(--surface); border: 2px solid var(--border); border-radius: 24px;
  padding: 7px 16px; font-size: 0.95rem; font-weight: 700; color: var(--fg2); cursor: pointer;
}
.back-btn:hover { border-color: var(--accent); color: var(--accent); }
.lesson-chip {
  background: var(--surface2); border: 2px solid var(--border); border-radius: 20px;
  padding: 6px 16px; font-size: 0.95rem; font-weight: 800; color: var(--accent); white-space: nowrap;
}
.progress-bar-wrap { flex: 1; height: 10px; background: var(--bg3); border-radius: 6px; overflow: hidden; min-width: 120px; }
.progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-hot)); transition: width 0.3s ease; }
.group-counter { font-size: 1rem; font-weight: 800; color: var(--fg2); white-space: nowrap; }
.mistake-chip { font-size: 0.95rem; font-weight: 700; color: var(--fg2); white-space: nowrap; }
.score-chip {
  padding: 6px 18px; border-radius: 24px; border: 2px solid var(--border); background: var(--surface);
  color: var(--accent-hot); font-size: 1.1rem; font-weight: 900; white-space: nowrap; margin-left: auto;
}

.match-tip { width: 100%; max-width: 1180px; text-align: center; font-size: 0.88rem; font-weight: 700; color: var(--fg2); }

.match-board-wrap {
  position: relative; width: 100%; max-width: 1180px;
  background: var(--surface); border: 3px solid var(--border); border-radius: 24px;
  padding: 24px; box-shadow: 0 8px 28px var(--shadow);
}
.match-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }
.match-line line { stroke-linecap: round; }
.match-line.ok line { stroke: #ef4444; stroke-width: 3.5; }
.match-line.ok circle { fill: #ef4444; }

.match-board {
  position: relative; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
  gap: 14px 160px;
}
@media (max-width: 760px) { .match-board { gap: 12px 30px; } }

.match-item {
  position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px;
  min-height: 60px; padding: 11px 16px; border-radius: 14px;
  border: 2.5px solid var(--border); background: var(--surface2);
  cursor: pointer; transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
}
.match-item:hover { border-color: var(--accent); box-shadow: 0 6px 18px var(--shadow); }
.match-item.match-left { align-items: center; text-align: center; }
.match-item.match-right { align-items: center; text-align: center; }

.match-item .match-word { font-size: 1.34rem; font-weight: 700; color: var(--fg); }
.match-item .m-tags { display: flex; align-items: baseline; justify-content: center; gap: 10px; flex-wrap: wrap; }
.match-item .m-pos { font-size: 0.8rem; font-weight: 800; color: var(--fg3); background: var(--bg2); border-radius: 8px; padding: 2px 8px; }
.match-item .m-kana { font-size: 1.25rem; font-weight: 700; color: var(--fg2); }
.match-item .m-mean { font-size: 1.25rem; font-weight: 700; color: var(--fg); }

.match-item.sel { border-color: var(--accent); background: rgba(37,99,235,0.13); box-shadow: 0 0 0 4px rgba(37,99,235,0.16); }
.match-item.done { border-color: var(--correct); background: var(--correct-bg); cursor: default; opacity: 0.85; pointer-events: none; }
.match-item.wrong { border-color: var(--wrong); background: var(--wrong-bg); animation: shakeX 0.32s; }
@keyframes shakeX { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--fg); color: #fff; border-radius: 28px; padding: 12px 26px;
  font-size: 1rem; font-weight: 700; opacity: 0; transition: all 0.25s ease; z-index: 300; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center;
  z-index: 200; padding: 20px; backdrop-filter: blur(8px);
}
.overlay-card {
  background: var(--surface); border-radius: 28px; padding: 34px 28px; text-align: center;
  width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 24px 70px rgba(0,0,0,0.35); border: 2px solid var(--border);
}
.overlay-emoji { font-size: 3.2rem; }
.overlay-title { font-size: 1.8rem; font-weight: 900; }
.overlay-body { font-size: 1rem; color: var(--fg2); line-height: 1.65; }
.overlay-stats-box {
  background: var(--bg); border-radius: 16px; padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; font-size: 0.9rem; font-weight: 700; text-align: left;
}
.overlay-stats-item b { color: var(--accent); }
.overlay-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
.action-btn { padding: 10px 20px; border-radius: 24px; border: none; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
.btn-primary { background: linear-gradient(135deg, var(--accent), #1d4ed8); color: #fff; }
.btn-hot { background: linear-gradient(135deg, var(--accent-hot), #ea580c); color: #fff; }
.btn-secondary { background: var(--surface); color: var(--fg2); border: 2px solid var(--border); }
</style>
</head>
<body>

  <nav class="top-nav">
    <div class="nav-logo jp-text" onclick="location.href='index.html'">かな<span>ゲーム</span></div>
  </nav>

  <div class="match-game">
    <div class="match-top-card">
      <button class="back-btn cn-text" onclick="location.href='index.html'">← 返回</button>
      <div class="lesson-chip cn-text" id="lessonName">入门单元 第1课</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="group-counter cn-text" id="groupCounter">1/8 组</div>
      <div class="mistake-chip cn-text" id="mistakeChip">失误 0</div>
      <div class="score-chip cn-text" id="scoreChip">0分</div>
    </div>

    <div class="match-tip">点左边的日语单词和右边对应的释义即可连线，先点哪边都行</div>

    <div class="match-board-wrap" id="boardWrap">
      <svg class="match-lines" id="svgLines"></svg>
      <div class="match-board" id="matchBoard"></div>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-card">
      <div class="overlay-emoji" id="ov-emoji">🏆</div>
      <div class="overlay-title cn-text" id="ov-title">整课大通关！</div>
      <div class="overlay-body cn-text" id="ov-body"></div>
      <div class="overlay-stats-box" id="ov-stats" hidden></div>
      <div class="overlay-actions" id="ov-actions"></div>
    </div>
  </div>

  <div class="toast cn-text" id="toast"></div>

  <script>
    const SUPABASE_URL = 'https://zbfjbtzvnhmfzyvooact.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_AP0YnQLgzmB3d63_4zbpjg_vHeTyo8Z';
    const sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
    let currentUser = null;

    async function initAuth() {
      if (!sbClient) return;
      const { data: { session } } = await sbClient.auth.getSession();
      if (session) currentUser = session.user;
    }

    async function recordMistake(word) {
      let localMistakes = JSON.parse(localStorage.getItem('tangogo_mistakes') || '[]');
      if (!localMistakes.some(m => m.word === word.kana)) {
        localMistakes.push({ word: word.kana, meaning: word.meaning });
        localStorage.setItem('tangogo_mistakes', JSON.stringify(localMistakes));
      }
      if (currentUser && sbClient) {
        try {
          await sbClient.from('user_mistakes').upsert({
            user_id: currentUser.id,
            word: word.kana,
            meaning: word.meaning,
            wrong_count: 1,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id,word' });
        } catch (e) { console.error(e); }
      }
    }

    // 丰富的生词库列表（支持多组推进）
    const ALL_WORDS = [
      { id: 1, kanji: 'いとこ', kana: 'いとこ', pos: '名', meaning: '堂(表)兄弟；堂(表)姐妹' },
      { id: 2, kanji: '乙', kana: 'おつ', pos: '名', meaning: '乙' },
      { id: 3, kanji: '草', kana: 'くさ', pos: '名', meaning: '草' },
      { id: 4, kanji: '家', kana: 'いえ', pos: '名', meaning: '房屋；家' },
      { id: 5, kanji: '', kana: 'アイス', pos: '名', meaning: '冰；冰淇淋' },
      { id: 6, kanji: '星', kana: 'ほし', pos: '名', meaning: '星星' },
      // 第2组
      { id: 7, kanji: '机', kana: 'つくえ', pos: '名', meaning: '书桌' },
      { id: 8, kanji: 'お菓子', kana: 'おかし', pos: '名', meaning: '点心；糖果' },
      { id: 9, kanji: '友達', kana: 'ともだち', pos: '名', meaning: '朋友' },
      { id: 10, kanji: '先生', kana: 'せんせい', pos: '名', meaning: '老师' },
      { id: 11, kanji: '学生', kana: 'がくせい', pos: '名', meaning: '学生' },
      { id: 12, kanji: '本', kana: 'ほん', pos: '名', meaning: '书' },
      // 第3组
      { id: 13, kanji: '靴', kana: 'くつ', pos: '名', meaning: '鞋' },
      { id: 14, kanji: '', kana: 'テスト', pos: '名', meaning: '测验，测试' },
      { id: 15, kanji: '時計', kana: 'とけい', pos: '名', meaning: '钟，表' },
      { id: 16, kanji: '挨拶', kana: 'あいさつ', pos: '名', meaning: '寒暄，打招呼' },
      { id: 17, kanji: '鉛筆', kana: 'えんぴつ', pos: '名', meaning: '铅笔' },
      { id: 18, kanji: '傘', kana: 'かさ', pos: '名', meaning: '伞' }
    ];

    const GROUP_SIZE = 6;
    let currentGroup = 0;
    const totalGroups = Math.ceil(ALL_WORDS.length / GROUP_SIZE);

    let score = 0;
    let mistakes = 0;
    let matchedInGroup = 0; // 当前组连对的词数
    let selectedLeft = null;
    let selectedRight = null;
    let startTime = Date.now();
    let currentRoundWords = [];

    let toastTimer = null;
    function showToast(msg, duration = 2200) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), duration);
    }

    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getShuffledRight(leftList) {
      let right = shuffleArray(leftList);
      if (leftList.length > 1) {
        let attempts = 0;
        while (attempts < 10 && right.some((item, idx) => item.id === leftList[idx].id)) {
          right = shuffleArray(leftList);
          attempts++;
        }
      }
      return right;
    }

    // 关键修复：计算当前词条在整课所有单词中的累计百分比
    function updateProgressBar() {
      const totalWords = ALL_WORDS.length;
      const completedWords = (currentGroup * GROUP_SIZE) + matchedInGroup;
      const pct = Math.min(100, Math.round((completedWords / totalWords) * 100));
      document.getElementById('progressFill').style.width = `${pct}%`;
    }

    function startGroup(groupIdx) {
      currentGroup = groupIdx;
      matchedInGroup = 0;
      selectedLeft = null;
      selectedRight = null;
      document.getElementById('svgLines').innerHTML = '';

      // 更新组指示器与词条累计进度条
      document.getElementById('groupCounter').innerText = `${currentGroup + 1}/${totalGroups} 组`;
      updateProgressBar();

      const start = groupIdx * GROUP_SIZE;
      const end = Math.min(start + GROUP_SIZE, ALL_WORDS.length);
      currentRoundWords = ALL_WORDS.slice(start, end);

      const leftList = shuffleArray(currentRoundWords);
      const rightList = getShuffledRight(leftList);

      const board = document.getElementById('matchBoard');
      board.innerHTML = '';

      for (let i = 0; i < currentRoundWords.length; i++) {
        const l = leftList[i];
        const leftEl = document.createElement('div');
        leftEl.className = 'match-item match-left';
        leftEl.dataset.id = l.id;
        leftEl.innerHTML = `<div class="match-word jp-text">${l.kanji || l.kana}</div>`;
        leftEl.onclick = () => selectCard('left', leftEl, l);
        board.appendChild(leftEl);

        const r = rightList[i];
        const rightEl = document.createElement('div');
        rightEl.className = 'match-item match-right';
        rightEl.dataset.id = r.id;
        rightEl.innerHTML = `
          <div class="m-tags">
            <span class="m-pos">${r.pos}</span>
            <span class="m-kana jp-text">${r.kana}</span>
            <span class="m-mean cn-text">${r.meaning}</span>
          </div>
        `;
        rightEl.onclick = () => selectCard('right', rightEl, r);
        board.appendChild(rightEl);
      }
    }

    function selectCard(side, el, item) {
      if (side === 'left') {
        if (selectedLeft) selectedLeft.el.classList.remove('sel');
        selectedLeft = { el, item };
        el.classList.add('sel');
      } else {
        if (selectedRight) selectedRight.el.classList.remove('sel');
        selectedRight = { el, item };
        el.classList.add('sel');
      }
      if (selectedLeft && selectedRight) checkMatch();
    }

    function checkMatch() {
      if (selectedLeft.item.id === selectedRight.item.id) {
        drawSvgLine(selectedLeft.el, selectedRight.el);
        selectedLeft.el.classList.remove('sel');
        selectedRight.el.classList.remove('sel');
        selectedLeft.el.classList.add('done');
        selectedRight.el.classList.add('done');

        score += 10;
        matchedInGroup++;
        document.getElementById('scoreChip').innerText = `${score}分`;
        
        // 连对一个词，进度条即时平滑增加一格
        updateProgressBar();

        selectedLeft = null;
        selectedRight = null;

        if (matchedInGroup === currentRoundWords.length) {
          handleGroupComplete();
        }
      } else {
        mistakes++;
        document.getElementById('mistakeChip').innerText = `失误 ${mistakes}`;
        recordMistake(selectedLeft.item);

        const lEl = selectedLeft.el; const rEl = selectedRight.el;
        lEl.classList.add('wrong'); rEl.classList.add('wrong');
        setTimeout(() => {
          lEl.classList.remove('sel', 'wrong');
          rEl.classList.remove('sel', 'wrong');
          selectedLeft = null; selectedRight = null;
        }, 400);
      }
    }

    function handleGroupComplete() {
      if (currentGroup < totalGroups - 1) {
        showToast(`🎉 第 ${currentGroup + 1} 组完成！准备进入下一组...`);
        setTimeout(() => {
          startGroup(currentGroup + 1);
        }, 1200);
      } else {
        const totalSeconds = Math.max(1, Math.round((Date.now() - startTime) / 1000));
        const m = Math.floor(totalSeconds / 60); const s = totalSeconds % 60;
        const timeFormatted = `${m > 0 ? m + '分' : ''}${s}秒`;

        const overlay = document.getElementById('overlay');
        document.getElementById('ov-body').textContent = `恭喜通关！本课全部 ${ALL_WORDS.length} 个单词已全部连线消除！`;
        const statsEl = document.getElementById('ov-stats');
        statsEl.hidden = false;
        statsEl.innerHTML = `
          <div class="overlay-stats-item">总得分：<b>${score} 分</b></div>
          <div class="overlay-stats-item">总用时：<b>${timeFormatted}</b></div>
          <div class="overlay-stats-item">总词数：<b>${ALL_WORDS.length} 词</b></div>
          <div class="overlay-stats-item">失误数：<b>${mistakes} 次</b></div>
        `;

        const actEl = document.getElementById('ov-actions');
        actEl.innerHTML = '';

        actEl.appendChild(createBtn('下一课', 'btn-primary', () => {
          showToast('正在前往下一课...');
          setTimeout(() => location.href = 'link.html?lesson=unit1_lesson2', 500);
        }));
        actEl.appendChild(createBtn('再来1遍', 'btn-secondary', () => {
          overlay.hidden = true;
          score = 0; mistakes = 0; startTime = Date.now();
          startGroup(0);
        }));
        actEl.appendChild(createBtn('📸 分享成绩', 'btn-hot', () => generateShareCard(score, timeFormatted, ALL_WORDS.length)));
        actEl.appendChild(createBtn('回到首页', 'btn-secondary', () => location.href = 'index.html'));

        overlay.hidden = false;
      }
    }

    function createBtn(text, cls, onClick) {
      const b = document.createElement('button');
      b.className = 'action-btn cn-text ' + cls;
      b.textContent = text;
      b.onclick = onClick;
      return b;
    }

    function generateShareCard(score, timeSpent, totalWords) {
      showToast('正在生成成绩单图片...');
      const cvs = document.createElement('canvas');
      cvs.width = 640; cvs.height = 840;
      const ctx = cvs.getContext('2d');
      const bgGrad = ctx.createLinearGradient(0, 0, 640, 840);
      bgGrad.addColorStop(0, '#f0f7ff'); bgGrad.addColorStop(1, '#bfdbfe');
      ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, 640, 840);

      ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 10; ctx.strokeRect(20, 20, 600, 800);
      ctx.fillStyle = '#2563eb'; ctx.font = "900 34px sans-serif"; ctx.textAlign = 'center';
      ctx.fillText('かなゲーム · 连连看闯关', 320, 90);
      ctx.font = "72px sans-serif"; ctx.fillText('🏆', 320, 180);
      ctx.fillStyle = '#0c2340'; ctx.font = "900 32px sans-serif"; ctx.fillText('通 关 荣 誉 证 书', 320, 240);

      const userNick = localStorage.getItem('tangogo_nickname') || '日语学习达人';
      ctx.font = "700 22px sans-serif"; ctx.fillStyle = '#1e4d8c'; ctx.fillText(`学员：${userNick}`, 320, 290);

      ctx.fillStyle = '#ffffff'; ctx.fillRect(80, 330, 480, 320);
      ctx.fillStyle = '#64748b'; ctx.font = "700 18px sans-serif"; ctx.textAlign = 'left';
      ctx.fillText('⏱ 通关用时', 120, 400);
      ctx.fillText('📖 掌握词汇', 120, 460);
      ctx.fillText('🌟 最终得分', 120, 520);
      ctx.fillText('🎮 挑战模式', 120, 580);

      ctx.textAlign = 'right'; ctx.fillStyle = '#0c2340'; ctx.font = "900 20px sans-serif";
      ctx.fillText(timeSpent, 520, 400);
      ctx.fillText(`${totalWords} 词`, 520, 460);
      ctx.fillStyle = '#ea580c'; ctx.font = "900 26px sans-serif"; ctx.fillText(`${score} 分`, 520, 520);
      ctx.fillStyle = '#2563eb'; ctx.font = "900 20px sans-serif"; ctx.fillText('连连看模式', 520, 580);

      setTimeout(() => {
        const a = document.createElement('a');
        a.href = cvs.toDataURL('image/png');
        a.download = `连连看通关成绩单_${Date.now()}.png`;
        a.click();
        showToast('🎉 成绩单图片已保存到本地！');
      }, 350);
    }

    function drawSvgLine(el1, el2) {
      const wrapRect = document.getElementById('boardWrap').getBoundingClientRect();
      const r1 = el1.getBoundingClientRect();
      const r2 = el2.getBoundingClientRect();

      const x1 = r1.right - wrapRect.left;
      const y1 = r1.top + r1.height / 2 - wrapRect.top;
      const x2 = r2.left - wrapRect.left;
      const y2 = r2.top + r2.height / 2 - wrapRect.top;

      const svg = document.getElementById('svgLines');
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'match-line ok');

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);

      const c1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c1.setAttribute('cx', x1); c1.setAttribute('cy', y1); c1.setAttribute('r', '5');
      const c2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c2.setAttribute('cx', x2); c2.setAttribute('cy', y2); c2.setAttribute('r', '5');

      g.appendChild(line); g.appendChild(c1); g.appendChild(c2);
      svg.appendChild(g);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await initAuth();
      startGroup(0);
    });
  </script>
</body>

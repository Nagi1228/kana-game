<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かなゲーム - 连连看模式</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #f0f7ff;
  --bg2: #dbeafe;
  --bg3: #bfdbfe;
  --surface: #ffffff;
  --surface2: #f8faff;
  --border: #93c5fd;
  --fg: #0c2340;
  --fg2: #1e4d8c;
  --fg3: #2563eb;
  --accent: #2563eb;
  --accent-hot: #f97316;
  --correct: #059669;
  --correct-bg: #d1fae5;
  --wrong: #e11d48;
  --wrong-bg: #ffe4e6;
  --shadow: rgba(37,99,235,0.18);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
  color: var(--fg);
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}

.top-nav {
  display: flex; align-items: center; gap: 10px; padding: 12px 24px;
  background-color: var(--surface);
  border-bottom: 2px solid var(--border);
  box-shadow: 0 2px 12px var(--shadow);
  position: sticky; top: 0; z-index: 50;
}
.nav-logo { font-size: 1.6rem; font-weight: 900; color: var(--accent); cursor: pointer; }
.nav-logo span { color: var(--accent-hot); }

.match-game {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 22px 16px; gap: 16px; justify-content: center;
}
.game-header.match-header { width: 100%; max-width: 1180px; display: flex; align-items: center; gap: 12px; }
.back-btn {
  background: var(--surface); border: 2px solid var(--border); border-radius: 24px;
  padding: 8px 16px; font-size: 0.95rem; font-weight: 700; color: var(--fg2);
  cursor: pointer; transition: all 0.15s;
}
.back-btn:hover { border-color: var(--accent); color: var(--accent); }
.score-chip {
  background: var(--bg2); border-radius: 24px; padding: 6px 16px; font-size: 0.95rem;
  font-weight: 700; color: var(--fg2);
}
.score-chip.level-chip { color: var(--accent); background: var(--surface); border: 2px solid var(--border); }
.score-chip.big {
  font-size: 1.1rem; color: var(--accent-hot); background: var(--surface);
  border: 2px solid var(--border); margin-left: auto;
}

.match-tip {
  width: 100%; max-width: 1180px; text-align: center;
  font-size: 0.88rem; font-weight: 700; color: var(--fg2);
}

/* 原版连连看外围大板与 SVG 连线层 */
.match-board-wrap {
  position: relative; width: 100%; max-width: 1180px;
  background: var(--surface); border: 3px solid var(--border); border-radius: 24px;
  padding: 24px; box-shadow: 0 8px 28px var(--shadow);
}
.match-lines {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 3; overflow: visible;
}
.match-line line { stroke-linecap: round; }
.match-line.ok line { stroke: #ef4444; stroke-width: 3.5; }
.match-line.ok circle { fill: #ef4444; }

/* 左右对称网格，中间留出超宽连线跑道 */
.match-board {
  position: relative; width: 100%;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 14px 190px;
}
@media (max-width: 760px) {
  .match-board { gap: 12px 40px; }
}

.match-item {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; justify-content: center; gap: 4px;
  min-height: 58px; min-width: 0;
  padding: 11px 16px; border-radius: 14px;
  border: 2.5px solid var(--border); background: var(--surface2);
  cursor: pointer; user-select: none;
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
}
.match-item:hover { border-color: var(--accent); box-shadow: 0 6px 18px var(--shadow); }
.match-item.match-left { align-items: center; text-align: center; }
.match-item.match-right { align-items: center; text-align: center; }

.match-item .match-word {
  font-size: 1.32rem; font-weight: 700; color: var(--fg); line-height: 1.25;
}
.match-item .m-tags { display: flex; align-items: baseline; gap: 10px; }
.match-item .m-pos {
  font-size: 0.82rem; font-weight: 800; color: var(--fg3);
  background: var(--bg2); border-radius: 8px; padding: 2px 8px;
}
.match-item .m-mean { font-size: 1.32rem; font-weight: 700; color: var(--fg); line-height: 1.3; }

.match-item.sel {
  border-color: var(--accent); background: rgba(37,99,235,0.13);
  box-shadow: 0 0 0 4px rgba(37,99,235,0.16);
}
.match-item.done {
  border-color: var(--correct); background: var(--correct-bg);
  cursor: default; opacity: 0.85; box-shadow: none; pointer-events: none;
}
.match-item.wrong {
  border-color: var(--wrong); background: var(--wrong-bg); animation: shakeX 0.32s;
}
@keyframes shakeX {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
</style>
</head>
<body>

  <nav class="top-nav">
    <div class="nav-logo" onclick="location.href='index.html'">かな<span>ゲーム</span></div>
  </nav>

  <div class="match-game">
    <div class="game-header match-header">
      <button class="back-btn" onclick="location.href='index.html'">← 返回</button>
      <span class="score-chip level-chip">🔗 连连看闯关</span>
      <span class="score-chip" id="match-mistakes">失误 0</span>
      <span class="score-chip big" id="match-score">0分</span>
    </div>

    <div class="match-tip">点左边的日语单词和右边对应的释义即可连线，先点哪边都行</div>

    <div class="match-board-wrap" id="boardWrap">
      <svg class="match-lines" id="svgLines"></svg>
      <div class="match-board" id="matchBoard"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zbfjbtzvnhmfzyvooact.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_AP0YnQLgzmB3d63_4zbpjg_vHeTyo8Z';
    const sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    let currentUser = null;
    let score = 0;
    let mistakes = 0;
    let matchedCount = 0;
    let selectedLeft = null;
    let selectedRight = null;

    const roundWords = [
      { id: 1, kanji: '先生', kana: 'せんせい', pos: '名', meaning: '老师' },
      { id: 2, kanji: '学生', kana: 'がくせい', pos: '名', meaning: '学生' },
      { id: 3, kanji: '友達', kana: 'ともだち', pos: '名', meaning: '朋友' },
      { id: 4, kanji: 'テスト', kana: 'テスト', pos: '名', meaning: '测验，测试' },
      { id: 5, kanji: '挨拶', kana: 'あいさつ', pos: '名', meaning: '寒暄，打招呼' }
    ];

    async function initAuth() {
      if (!sbClient) return;
      const { data: { session } } = await sbClient.auth.getSession();
      if (session) currentUser = session.user;
    }

    async function recordMistake(word) {
      let localMistakes = JSON.parse(localStorage.getItem('tangogo_mistakes') || '[]');
      if (!localMistakes.some(m => m.word === word.kana)) {
        localMistakes.push({ word: word.kana, meaning: word.meaning });
        localStorage.setItem('tangogo_mistakes', JSON.stringify(localMistakes));
      }
      if (currentUser && sbClient) {
        try {
          await sbClient.from('user_mistakes').upsert({
            user_id: currentUser.id,
            word: word.kana,
            meaning: word.meaning,
            wrong_count: 1,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id,word' });
        } catch (e) { console.error(e); }
      }
    }

    function initBoard() {
      matchedCount = 0;
      selectedLeft = null;
      selectedRight = null;
      document.getElementById('svgLines').innerHTML = '';

      const leftList = [...roundWords].sort(() => Math.random() - 0.5);
      const rightList = [...roundWords].sort(() => Math.random() - 0.5);

      const board = document.getElementById('matchBoard');
      board.innerHTML = '';

      // 按照左右交错排进网格：每个左边元素紧接着右边元素
      for (let i = 0; i < roundWords.length; i++) {
        // 左边卡片
        const l = leftList[i];
        const leftEl = document.createElement('div');
        leftEl.className = 'match-item match-left';
        leftEl.dataset.id = l.id;
        leftEl.innerHTML = `<div class="match-word">${l.kanji || l.kana}</div>`;
        leftEl.onclick = () => selectCard('left', leftEl, l);
        board.appendChild(leftEl);

        // 右边卡片
        const r = rightList[i];
        const rightEl = document.createElement('div');
        rightEl.className = 'match-item match-right';
        rightEl.dataset.id = r.id;
        rightEl.innerHTML = `
          <div class="m-tags"><span class="m-pos">${r.pos}</span></div>
          <div class="m-mean">${r.meaning}</div>
        `;
        rightEl.onclick = () => selectCard('right', rightEl, r);
        board.appendChild(rightEl);
      }
    }

    function selectCard(side, el, item) {
      if (side === 'left') {
        if (selectedLeft) selectedLeft.el.classList.remove('sel');
        selectedLeft = { el, item };
        el.classList.add('sel');
      } else {
        if (selectedRight) selectedRight.el.classList.remove('sel');
        selectedRight = { el, item };
        el.classList.add('sel');
      }

      if (selectedLeft && selectedRight) {
        checkMatch();
      }
    }

    function checkMatch() {
      if (selectedLeft.item.id === selectedRight.item.id) {
        // 配对正确：划红线并连通
        drawSvgLine(selectedLeft.el, selectedRight.el);
        selectedLeft.el.classList.remove('sel');
        selectedRight.el.classList.remove('sel');
        selectedLeft.el.classList.add('done');
        selectedRight.el.classList.add('done');

        score += 10;
        matchedCount++;
        document.getElementById('match-score').innerText = `${score}分`;

        selectedLeft = null;
        selectedRight = null;

        if (matchedCount === roundWords.length) {
          setTimeout(() => {
            alert('🎉 恭喜！全部连线消除成功！');
            location.reload();
          }, 400);
        }
      } else {
        // 配对错误
        mistakes++;
        document.getElementById('match-mistakes').innerText = `失误 ${mistakes}`;
        recordMistake(selectedLeft.item);

        const lEl = selectedLeft.el;
        const rEl = selectedRight.el;
        lEl.classList.add('wrong');
        rEl.classList.add('wrong');

        setTimeout(() => {
          lEl.classList.remove('sel', 'wrong');
          rEl.classList.remove('sel', 'wrong');
          selectedLeft = null;
          selectedRight = null;
        }, 400);
      }
    }

    // 在卡片右锚点与左锚点之间拉出原版红线
    function drawSvgLine(el1, el2) {
      const wrapRect = document.getElementById('boardWrap').getBoundingClientRect();
      const r1 = el1.getBoundingClientRect();
      const r2 = el2.getBoundingClientRect();

      const x1 = r1.right - wrapRect.left;
      const y1 = r1.top + r1.height / 2 - wrapRect.top;
      const x2 = r2.left - wrapRect.left;
      const y2 = r2.top + r2.height / 2 - wrapRect.top;

      const svg = document.getElementById('svgLines');
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'match-line ok');

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);

      const c1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c1.setAttribute('cx', x1);
      c1.setAttribute('cy', y1);
      c1.setAttribute('r', '5');

      const c2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c2.setAttribute('cx', x2);
      c2.setAttribute('cy', y2);
      c2.setAttribute('r', '5');

      g.appendChild(line);
      g.appendChild(c1);
      g.appendChild(c2);
      svg.appendChild(g);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await initAuth();
      initBoard();
    });
  </script>
</body>
</html>

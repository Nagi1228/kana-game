<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>かなゲーム - 消消乐模式</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=M+PLUS+Rounded+1c:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&display=swap">
  <style>
    :root {
      --bg: #f0f7ff;
      --bg2: #dbeafe;
      --bg3: #bfdbfe;
      --surface: #ffffff;
      --surface2: #f8faff;
      --border: #93c5fd;
      --fg: #0c2340;
      --fg2: #1e4d8c;
      --fg3: #2563eb;
      --accent: #2563eb;
      --accent-hot: #f97316;
      --correct: #059669;
      --correct-bg: #d1fae5;
      --wrong: #e11d48;
      --wrong-bg: #ffe4e6;
      --shadow: rgba(37,99,235,0.18);
      --elim-word-bg: #e7f0fe;
      --elim-word-bd: #aac9f2;
      --elim-desc-bg: #fdf2df;
      --elim-desc-bd: #e9cb92;
      --elim-pos-bg: rgba(12,35,64,0.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
      color: var(--fg); min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      overflow-x: hidden; user-select: none;
    }
    .jp-text { font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif; }
    .cn-text { font-family: 'Noto Sans SC', sans-serif; }
    [hidden] { display: none !important; }

    header {
      width: 100%; background: var(--surface); border-bottom: 2px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; padding: 12px 24px;
      box-shadow: 0 2px 12px var(--shadow); position: sticky; top: 0; z-index: 50;
    }
    .logo { font-size: 1.6rem; font-weight: 900; color: var(--accent); cursor: pointer; }
    .logo span { color: var(--accent-hot); }

    .elim-game {
      width: 100%; max-width: 1180px; padding: 24px 16px;
      display: flex; flex-direction: column; align-items: center; gap: 16px; flex: 1; justify-content: center;
    }

    /* 1:1 还原图 3 顶部大白框控制条 */
    .elim-top-card {
      width: 100%; background: var(--surface); border: 2.5px solid var(--border);
      border-radius: 20px; padding: 12px 20px; display: flex; align-items: center; gap: 14px;
      box-shadow: 0 4px 16px var(--shadow); flex-wrap: wrap;
    }
    .back-btn {
      background: var(--surface); border: 2px solid var(--border); border-radius: 24px;
      padding: 7px 16px; font-size: 0.95rem; font-weight: 700; color: var(--fg2); cursor: pointer;
    }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); }
    .lesson-chip {
      background: var(--surface2); border: 2px solid var(--border); border-radius: 20px;
      padding: 6px 16px; font-size: 0.95rem; font-weight: 800; color: var(--accent); white-space: nowrap;
    }
    .progress-bar-wrap { flex: 1; height: 10px; background: var(--bg3); border-radius: 6px; overflow: hidden; min-width: 100px; }
    .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-hot)); transition: width 0.3s; }
    .group-counter { font-size: 1rem; font-weight: 800; color: var(--fg2); white-space: nowrap; }
    .mistake-chip { font-size: 0.95rem; font-weight: 700; color: var(--fg2); white-space: nowrap; }
    .score-chip {
      padding: 6px 18px; border-radius: 24px; border: 2px solid var(--border); background: var(--surface);
      color: var(--accent-hot); font-size: 1.1rem; font-weight: 900; white-space: nowrap; margin-left: auto;
    }

    .elim-tip { width: 100%; text-align: center; font-size: 0.88rem; font-weight: 700; color: var(--fg2); }

    .elim-board-wrap {
      position: relative; width: 100%; background: var(--surface); border: 3px solid var(--border);
      border-radius: 24px; padding: 24px; box-shadow: 0 8px 28px var(--shadow);
    }
    .elim-board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    @media (max-width: 860px) { .elim-board { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; } }
    @media (max-width: 480px) { .elim-board { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } }

    .elim-card {
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
      min-height: 96px; padding: 10px 12px; border-radius: 16px; border: 2.5px solid var(--border);
      text-align: center; cursor: pointer; user-select: none; transition: border-color 0.15s, background 0.15s, box-shadow 0.15s, opacity 0.2s;
    }
    .elim-card:hover { border-color: var(--accent); box-shadow: 0 6px 18px var(--shadow); }
    .elim-card-word { background: var(--elim-word-bg); border-color: var(--elim-word-bd); }
    .elim-card-desc { background: var(--elim-desc-bg); border-color: var(--elim-desc-bd); }

    .elim-card .elim-word { font-size: 1.34rem; font-weight: 700; color: var(--fg); line-height: 1.25; }
    .elim-card .m-tags { display: flex; align-items: baseline; justify-content: center; gap: 8px; }
    .elim-card .m-pos { font-size: 0.78rem; font-weight: 800; color: var(--fg3); background: var(--elim-pos-bg); border-radius: 8px; padding: 2px 7px; }
    .elim-card .m-kana { font-size: 1.34rem; font-weight: 700; color: var(--fg2); }
    .elim-card .m-mean { font-size: 1.34rem; font-weight: 700; color: var(--fg); }

    .elim-card.sel { border-color: var(--accent); background: rgba(37,99,235,0.13); box-shadow: 0 0 0 4px rgba(37,99,235,0.16); }
    .elim-card.wrong { border-color: var(--wrong); background: var(--wrong-bg); animation: shakeX 0.32s; }
    @keyframes shakeX { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

    .elim-card.matched { animation: elimPop 0.34s ease forwards; pointer-events: none; }
    @keyframes elimPop {
      0% { opacity: 1; transform: scale(1); }
      30% { opacity: 1; transform: scale(1.07); border-color: var(--correct); background: var(--correct-bg); }
      100% { opacity: 0; transform: scale(0.55); }
    }
    .elim-card.gone { visibility: hidden; }

    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--fg); color: #fff; border-radius: 28px; padding: 12px 26px;
      font-size: 1rem; font-weight: 700; opacity: 0; transition: all 0.25s ease; z-index: 300; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center;
      z-index: 200; padding: 20px; backdrop-filter: blur(8px);
    }
    .overlay-card {
      background: var(--surface); border-radius: 28px; padding: 34px 28px; text-align: center;
      width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.35); border: 2px solid var(--border);
    }
    .overlay-emoji { font-size: 3.2rem; }
    .overlay-title { font-size: 1.8rem; font-weight: 900; }
    .overlay-body { font-size: 1rem; color: var(--fg2); line-height: 1.65; }
    .overlay-stats-box {
      background: var(--bg); border-radius: 16px; padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; font-size: 0.9rem; font-weight: 700; text-align: left;
    }
    .overlay-stats-item b { color: var(--accent); }
    .overlay-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
    .action-btn { padding: 10px 20px; border-radius: 24px; border: none; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #1d4ed8); color: #fff; }
    .btn-hot { background: linear-gradient(135deg, var(--accent-hot), #ea580c); color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--fg2); border: 2px solid var(--border); }
  </style>
</head>
<body>

  <header>
    <div class="logo jp-text" onclick="location.href='index.html'">かな<span>ゲーム</span></div>
  </header>

  <div class="elim-game">
    <!-- 1:1 还原图 3 顶栏状态组件 -->
    <div class="elim-top-card">
      <button class="back-btn cn-text" onclick="location.href='index.html'">← 返回</button>
      <div class="lesson-chip cn-text" id="lessonName">入门单元 第1课</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="group-counter cn-text" id="groupCounter">1/7 组</div>
      <div class="mistake-chip cn-text" id="mistakeChip">失误 0</div>
      <div class="score-chip cn-text" id="scoreChip">0分</div>
    </div>

    <div class="elim-tip">每轮 12 张卡片：6 个单词原形 + 6 个对应释义，点中配对的两张就会一起消失</div>

    <div class="elim-board-wrap">
      <div class="elim-board" id="elim-board"></div>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-card">
      <div class="overlay-emoji" id="ov-emoji">🏆</div>
      <div class="overlay-title cn-text" id="ov-title">整课大通关！</div>
      <div class="overlay-body cn-text" id="ov-body"></div>
      <div class="overlay-stats-box" id="ov-stats" hidden></div>
      <div class="overlay-actions" id="ov-actions"></div>
    </div>
  </div>

  <div class="toast cn-text" id="toast"></div>

  <script>
    const SUPABASE_URL = 'https://zbfjbtzvnhmfzyvooact.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_AP0YnQLgzmB3d63_4zbpjg_vHeTyo8Z';
    const sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
    let currentUser = null;

    async function initAuth() {
      if (!sbClient) return;
      const { data: { session } } = await sbClient.auth.getSession();
      if (session) currentUser = session.user;
    }

    async function recordMistake(word) {
      let localMistakes = JSON.parse(localStorage.getItem('tangogo_mistakes') || '[]');
      if (!localMistakes.some(m => m.word === word.kana)) {
        localMistakes.push({ word: word.kana, meaning: word.meaning });
        localStorage.setItem('tangogo_mistakes', JSON.stringify(localMistakes));
      }
      if (currentUser && sbClient) {
        try {
          await sbClient.from('user_mistakes').upsert({
            user_id: currentUser.id,
            word: word.kana,
            meaning: word.meaning,
            wrong_count: 1,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id,word' });
        } catch (e) { console.error(e); }
      }
    }

    // 与截图 3 完全一致的词库列表
    const ALL_WORDS = [
      { id: 1, kanji: '池', kana: 'いけ', pos: '名', meaning: '池塘' },
      { id: 2, kanji: '祖国', kana: 'そこく', pos: '名', meaning: '祖国' },
      { id: 3, kanji: 'お金', kana: 'おかね', pos: '名', meaning: '钱，金钱' },
      { id: 4, kanji: '甲', kana: 'こう', pos: '名', meaning: '甲' },
      { id: 5, kanji: '靴', kana: 'くつ', pos: '名', meaning: '鞋' },
      { id: 6, kanji: '肉', kana: 'にく', pos: '名', meaning: '肉' },
      // 第 2 组 (6个)
      { id: 7, kanji: '先生', kana: 'せんせい', pos: '名', meaning: '老师' },
      { id: 8, kanji: '学生', kana: 'がくせい', pos: '名', meaning: '学生' },
      { id: 9, kanji: '友達', kana: 'ともだち', pos: '名', meaning: '朋友' },
      { id: 10, kanji: '本', kana: 'ほん', pos: '名', meaning: '书' },
      { id: 11, kanji: '', kana: 'テスト', pos: '名', meaning: '测验，测试' },
      { id: 12, kanji: '時計', kana: 'とけい', pos: '名', meaning: '钟，表' }
    ];

    const GROUP_SIZE = 6;
    let currentGroup = 0;
    const totalGroups = Math.ceil(ALL_WORDS.length / GROUP_SIZE);

    let score = 0;
    let mistakes = 0;
    let matchedPairs = 0;
    let selectedCards = [];
    let isProcessing = false;
    let startTime = Date.now();
    let currentRoundWords = [];

    let toastTimer = null;
    function showToast(msg, duration = 2200) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), duration);
    }

    function startGroup(groupIdx) {
      currentGroup = groupIdx;
      matchedPairs = 0;
      selectedCards = [];
      isProcessing = false;

      // 更新图 3 状态栏
      document.getElementById('groupCounter').innerText = `${currentGroup + 1}/${totalGroups} 组`;
      document.getElementById('progressFill').style.width = `${((currentGroup + 1) / totalGroups) * 100}%`;

      const start = groupIdx * GROUP_SIZE;
      const end = Math.min(start + GROUP_SIZE, ALL_WORDS.length);
      currentRoundWords = ALL_WORDS.slice(start, end);

      const cards = [];
      currentRoundWords.forEach(w => {
        cards.push({ id: w.id, kind: 'word', raw: w });
        cards.push({ id: w.id, kind: 'desc', raw: w });
      });

      cards.sort(() => Math.random() - 0.5);

      const board = document.getElementById('elim-board');
      board.innerHTML = '';
      cards.forEach(c => {
        const el = document.createElement('div');
        el.className = `elim-card ${c.kind === 'word' ? 'elim-card-word' : 'elim-card-desc'}`;

        if (c.kind === 'word') {
          el.innerHTML = `<div class="elim-word jp-text">${c.raw.kanji || c.raw.kana}</div>`;
        } else {
          el.innerHTML = `
            <div class="m-tags">
              <span class="m-pos">${c.raw.pos}</span>
              <span class="m-kana jp-text">${c.raw.kana}</span>
              <span class="m-mean cn-text">${c.raw.meaning}</span>
            </div>
          `;
        }

        el.onclick = () => onCardClick(el, c);
        board.appendChild(el);
      });
    }

    function onCardClick(el, card) {
      if (isProcessing || el.classList.contains('sel') || el.classList.contains('matched')) return;

      el.classList.add('sel');
      selectedCards.push({ el, card });

      if (selectedCards.length === 2) {
        isProcessing = true;
        checkMatch();
      }
    }

    function checkMatch() {
      const [c1, c2] = selectedCards;

      if (c1.card.id === c2.card.id && c1.card.kind !== c2.card.kind) {
        score += 10;
        matchedPairs++;
        document.getElementById('scoreChip').innerText = `${score}分`;

        c1.el.classList.remove('sel'); c2.el.classList.remove('sel');
        c1.el.classList.add('matched'); c2.el.classList.add('matched');

        setTimeout(() => {
          c1.el.classList.add('gone'); c2.el.classList.add('gone');
          selectedCards = [];
          isProcessing = false;

          if (matchedPairs === currentRoundWords.length) {
            handleGroupComplete();
          }
        }, 340);
      } else {
        mistakes++;
        document.getElementById('mistakeChip').innerText = `失误 ${mistakes}`;
        recordMistake(c1.card.raw);

        c1.el.classList.add('wrong'); c2.el.classList.add('wrong');

        setTimeout(() => {
          c1.el.classList.remove('sel', 'wrong');
          c2.el.classList.remove('sel', 'wrong');
          selectedCards = [];
          isProcessing = false;
        }, 450);
      }
    }

    function handleGroupComplete() {
      if (currentGroup < totalGroups - 1) {
        showToast(`🎉 第 ${currentGroup + 1} 组完成！准备进入下一组...`);
        setTimeout(() => {
          startGroup(currentGroup + 1);
        }, 1200);
      } else {
        const totalSeconds = Math.max(1, Math.round((Date.now() - startTime) / 1000));
        const m = Math.floor(totalSeconds / 60); const s = totalSeconds % 60;
        const timeFormatted = `${m > 0 ? m + '分' : ''}${s}秒`;

        const overlay = document.getElementById('overlay');
        document.getElementById('ov-body').textContent = `恭喜通关！本课全部 ${ALL_WORDS.length} 个单词已全部消除完毕！`;
        const statsEl = document.getElementById('ov-stats');
        statsEl.hidden = false;
        statsEl.innerHTML = `
          <div class="overlay-stats-item">总得分：<b>${score} 分</b></div>
          <div class="overlay-stats-item">总用时：<b>${timeFormatted}</b></div>
          <div class="overlay-stats-item">总词数：<b>${ALL_WORDS.length} 词</b></div>
          <div class="overlay-stats-item">失误数：<b>${mistakes} 次</b></div>
        `;

        const actEl = document.getElementById('ov-actions');
        actEl.innerHTML = '';

        actEl.appendChild(createBtn('下一课', 'btn-primary', () => {
          showToast('正在前往下一课...');
          setTimeout(() => location.href = 'match.html?lesson=unit1_lesson2', 500);
        }));
        actEl.appendChild(createBtn('再来1遍', 'btn-secondary', () => {
          overlay.hidden = true;
          score = 0; mistakes = 0; startTime = Date.now();
          startGroup(0);
        }));
        actEl.appendChild(createBtn('📸 分享成绩', 'btn-hot', () => generateShareCard(score, timeFormatted, ALL_WORDS.length)));
        actEl.appendChild(createBtn('回到首页', 'btn-secondary', () => location.href = 'index.html'));

        overlay.hidden = false;
      }
    }

    function createBtn(text, cls, onClick) {
      const b = document.createElement('button');
      b.className = 'action-btn cn-text ' + cls;
      b.textContent = text;
      b.onclick = onClick;
      return b;
    }

    function generateShareCard(score, timeSpent, totalWords) {
      showToast('正在生成成绩单图片...');
      const cvs = document.createElement('canvas');
      cvs.width = 640; cvs.height = 840;
      const ctx = cvs.getContext('2d');
      const bgGrad = ctx.createLinearGradient(0, 0, 640, 840);
      bgGrad.addColorStop(0, '#f0f7ff'); bgGrad.addColorStop(1, '#bfdbfe');
      ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, 640, 840);

      ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 10; ctx.strokeRect(20, 20, 600, 800);
      ctx.fillStyle = '#2563eb'; ctx.font = "900 34px sans-serif"; ctx.textAlign = 'center';
      ctx.fillText('かなゲーム · 消消乐闯关', 320, 90);
      ctx.font = "72px sans-serif"; ctx.fillText('🏆', 320, 180);
      ctx.fillStyle = '#0c2340'; ctx.font = "900 32px sans-serif"; ctx.fillText('通 关 荣 誉 证 书', 320, 240);

      const userNick = localStorage.getItem('tangogo_nickname') || '日语学员';
      ctx.font = "700 22px sans-serif"; ctx.fillStyle = '#1e4d8c'; ctx.fillText(`学员：${userNick}`, 320, 290);

      ctx.fillStyle = '#ffffff'; ctx.fillRect(80, 330, 480, 320);
      ctx.fillStyle = '#64748b'; ctx.font = "700 18px sans-serif"; ctx.textAlign = 'left';
      ctx.fillText('⏱ 通关用时', 120, 400);
      ctx.fillText('📖 掌握词汇', 120, 460);
      ctx.fillText('🌟 最终得分', 120, 520);
      ctx.fillText('🎮 挑战模式', 120, 580);

      ctx.textAlign = 'right'; ctx.fillStyle = '#0c2340'; ctx.font = "900 20px sans-serif";
      ctx.fillText(timeSpent, 520, 400);
      ctx.fillText(`${totalWords} 词`, 520, 460);
      ctx.fillStyle = '#ea580c'; ctx.font = "900 26px sans-serif"; ctx.fillText(`${score} 分`, 520, 520);
      ctx.fillStyle = '#2563eb'; ctx.font = "900 20px sans-serif"; ctx.fillText('消消乐模式', 520, 580);

      setTimeout(() => {
        const a = document.createElement('a');
        a.href = cvs.toDataURL('image/png');
        a.download = `消消乐通关成绩单_${Date.now()}.png`;
        a.click();
        showToast('🎉 成绩单图片已保存到本地！');
      }, 350);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await initAuth();
      startGroup(0);
    });
  </script>
</body>
</html>
